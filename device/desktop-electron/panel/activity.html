<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summrise — operations</title>
<style>
  :root{
    --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc; --ink:#191b1f; --ink-2:#41454c;
    --muted:#6b7078; --faint:#9aa0a8; --line:#e5e7eb; --line-2:#eef0f3;
    --accent:#c2410c; --accent-soft:#fff1e8; --ok:#1a7f37; --ok-soft:#e8f5ec;
    --fail:#cf222e; --fail-soft:#fdecec; --run:#9a6700; --run-soft:#fdf5e2;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.04),0 4px 12px rgba(16,24,40,.06);
    color-scheme:light;
  }
  [data-theme="dark"]{
    --bg:#0d0f12; --surface:#15181d; --surface-2:#191d23; --ink:#e9ebee; --ink-2:#c6cad0;
    --muted:#9aa0a8; --faint:#6b7280; --line:#262b33; --line-2:#1d2229;
    --accent:#e2632b; --accent-soft:#2a1a12; --ok:#3fb950; --ok-soft:#12261a;
    --fail:#f85149; --fail-soft:#2a1416; --run:#d29922; --run-soft:#2a2211;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:-.01em;font-size:14.5px}
  .brand .mark{width:18px;height:18px;border-radius:6px;background:linear-gradient(145deg,#e2632b,#b83a06);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .stem{color:var(--faint);font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted);background:var(--surface)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 16%,transparent)}
  .grow{flex:1}
  .counts{font-size:12px;color:var(--muted)}
  .counts b{color:var(--ink);font-weight:600}
  select.filter{height:26px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);font:12px var(--sans);padding:0 8px;outline:none}
  select.filter:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent)}
  button.icon{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);cursor:pointer;font-size:14px}
  button.icon:hover{border-color:var(--accent);color:var(--accent)}
  main{flex:1;overflow:auto;padding:8px 0 48px}
  .feed{max-width:980px;margin:0 auto;padding:0 24px}
  .turn{display:flex;align-items:center;gap:10px;margin:22px 0 6px;color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
  .turn::after{content:"";flex:1;height:1px;background:var(--line)}
  .row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .row:hover{background:var(--surface-2);border-color:var(--line-2)}
  .row.selected{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
  .glyph{line-height:22px;font-size:12px;text-align:center}
  .glyph.ok{color:var(--ok)} .glyph.fail{color:var(--fail)} .glyph.run{color:var(--run)}
  .spinner{display:inline-block;width:10px;height:10px;border:1.5px solid color-mix(in srgb,var(--run) 30%,transparent);border-top-color:var(--run);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .line{display:flex;align-items:center;gap:8px;min-height:22px;flex-wrap:nowrap;min-width:0;overflow:hidden}
  .tool{font:12.5px/1.4 var(--mono);color:var(--ink);font-weight:500;white-space:nowrap}
  .verb{color:var(--muted);font-size:12.5px;white-space:nowrap}
  .chip{display:inline-flex;align-items:center;flex:none;height:19px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;letter-spacing:.01em;white-space:nowrap}
  .chip.allow{color:#0969da;background:#e7f1ff} .chip.deny{color:var(--fail);background:var(--fail-soft)}
  .chip.ok{color:var(--ok);background:var(--ok-soft)} .chip.fail{color:var(--fail);background:var(--fail-soft)}
  .chip.run{color:var(--run);background:var(--run-soft)} .chip.muted{color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2)}
  [data-theme="dark"] .chip.allow{color:#79c0ff;background:#12233a}
  .args{font:12px/1.4 var(--mono);color:var(--muted);flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .outcome{font:12px/1.4 var(--mono);color:var(--ink-2)}
  .meta{display:flex;align-items:center;gap:8px;justify-content:flex-end;font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
  .dur{min-width:44px;text-align:right}
  .detail{grid-column:2/4;display:none;margin:6px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
  .row.selected .detail{display:block}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;font-size:13px}
  .kv .k{color:var(--faint)} .kv .v{color:var(--ink);overflow-wrap:anywhere;font-family:var(--mono);font-size:12.5px}
  .kv .v.plain{font-family:var(--sans);font-size:13px}
  .detail pre{margin:0;white-space:pre-wrap;word-break:break-word;background:var(--surface-2);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:12px/1.5 var(--mono);color:var(--ink)}
  .detail .note{color:var(--faint);font-size:11.5px;margin-top:8px}
  .openlink{color:var(--accent);text-decoration:none;font-size:12.5px}
  .openlink:hover{text-decoration:underline}
  .empty{max-width:980px;margin:80px auto;padding:0 24px;color:var(--faint);font-size:13px}
  .empty b{display:block;color:var(--ink-2);font-weight:600;font-size:15px;margin-bottom:4px}
  footer{display:flex;align-items:center;gap:16px;padding:9px 20px;border-top:1px solid var(--line);background:var(--surface);color:var(--faint);font-size:11.5px}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;font:10.5px var(--mono);color:var(--muted);background:var(--surface-2)}
</style>
</head>
<body>
<header>
  <span class="brand"><span class="mark"></span>Summrise<span class="stem">operations</span></span>
  <span class="pill"><i id="dot" class="dot"></i><span id="where">connecting</span></span>
  <span class="pill" id="version">—</span>
  <div class="grow"></div>
  <span class="counts" id="counts"><b>0</b> calls · <b>0</b> failed</span>
  <select class="filter" id="filter" aria-label="Tool filter">
    <option value="all">All tools</option>
    <option value="runs">Runs</option>
    <option value="terminal">Terminal</option>
    <option value="files">Files</option>
    <option value="other">Other</option>
  </select>
  <button class="icon" id="theme" title="Toggle light/dark" aria-label="Toggle theme">☾</button>
</header>
<main id="main">
  <div class="feed" id="feed"></div>
  <div class="empty" id="empty"><b>Waiting for the AI to act</b>Tool calls appear here as they happen, newest at the bottom.</div>
</main>
<footer>
  <span id="conn">stream: connecting…</span>
  <span id="last">no events yet</span>
  <span class="grow"></span>
  <span><kbd>f</kbd> follow</span>
  <span><kbd>click</kbd> details</span>
</footer>
<script>
(function(){
  const feed = document.getElementById("feed");
  const empty = document.getElementById("empty");
  const dot = document.getElementById("dot");
  const where = document.getElementById("where");
  const version = document.getElementById("version");
  const counts = document.getElementById("counts");
  const conn = document.getElementById("conn");
  const last = document.getElementById("last");
  const themeButton = document.getElementById("theme");

  const VERBS = {
    "runs.exec": "run a command", "runs.get": "read a run", "runs.list": "list runs",
    "terminal.open": "open a terminal", "terminal.create": "open a terminal",
    "terminal.write": "type into a terminal", "terminal.read": "read a terminal", "terminal.close": "close a terminal",
    "files.read": "read a file", "files.write": "write a file", "files.list": "list files",
    "screen.capture": "look at the screen", "state.get": "read device state",
    "browser.open": "open a browser", "browser.navigate": "navigate a browser",
    "monitor.add": "watch an endpoint", "monitor.list": "list watches", "monitor.probe": "probe an endpoint",
  };

  const calls = new Map();
  const order = [];
  let selected = null;
  let follow = true;
  let filter = "all";

  function escapeHtml(text){
    return String(text).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }
  function fmtDur(ms){ return ms < 1000 ? Math.round(ms) + "ms" : (ms/1000).toFixed(1) + "s"; }
  function fmtClock(ms){ return new Date(ms).toLocaleTimeString([], { hour12:false }); }
  function toolVerb(tool){ return VERBS[tool] || ""; }
  function groupOf(tool){
    if (tool.indexOf("runs.") === 0) return "runs";
    if (tool.indexOf("terminal.") === 0) return "terminal";
    if (tool.indexOf("files.") === 0) return "files";
    return "other";
  }

  // THEME: light first, a saved choice wins, and the button flips both the attribute and the label.
  function applyTheme(theme){
    document.documentElement.dataset.theme = theme;
    themeButton.textContent = theme === "dark" ? "☀" : "☾";
    themeButton.title = theme === "dark" ? "Switch to light" : "Switch to dark";
  }
  let saved = "light";
  try { saved = localStorage.getItem("summrise-theme") || "light"; } catch {}
  // A `?theme=dark|light` link wins over the saved choice: it is how a screenshot or a support
  // conversation names the theme without touching this profile.
  const queryTheme = new URLSearchParams(location.search).get("theme");
  if (queryTheme === "dark" || queryTheme === "light") saved = queryTheme;
  applyTheme(saved === "dark" ? "dark" : "light");
  themeButton.onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    try { localStorage.setItem("summrise-theme", next); } catch {}
  };

  document.getElementById("filter").onchange = (e) => { filter = e.target.value; schedule(); };
  document.getElementById("filter").value = filter;

  function add(ev){
    if (!ev || typeof ev.id !== "number") return;
    let c = calls.get(ev.id);
    if (ev.event === "begin") {
      c = { id: ev.id, tool: ev.tool || "unknown", decision: ev.decision || "", args: ev.args || "", start: ev.ts_ms || Date.now(), end: null, ok: null };
      calls.set(ev.id, c); order.push(ev.id);
    } else if (ev.event === "end") {
      if (!c) { c = { id: ev.id, tool: "unknown", decision: "", start: ev.ts_ms || Date.now(), end: null, ok: null }; calls.set(ev.id, c); order.push(ev.id); }
      c.end = ev.ts_ms || Date.now(); c.ok = ev.ok === true;
      if (ev.outcome) c.outcome = ev.outcome;
      if (ev.error_kind) c.errorKind = ev.error_kind;
      if (ev.run_id) c.runId = ev.run_id;
    }
    schedule();
  }

  let raf = 0;
  function schedule(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; render(); }); }

  function render(){
    const now = Date.now();
    if (!order.length) { empty.style.display = ""; feed.innerHTML = ""; return; }
    empty.style.display = "none";

    let html = "";
    let turnStart = null;
    const shown = order.map((id) => calls.get(id)).filter((c) => c && (filter === "all" || groupOf(c.tool) === filter));
    shown.forEach((c) => {
      if (turnStart == null || c.start - turnStart > 8000) { turnStart = c.start; html += `<div class="turn">${fmtClock(c.start)}</div>`; }
      const dur = (c.end == null ? now : c.end) - c.start;
      const cls = c.end == null ? "run" : (c.ok ? "ok" : "fail");
      const glyph = c.end == null ? '<span class="spinner"></span>' : (c.ok ? "✓" : "✗");
      const decision = c.decision ? `<span class="chip ${c.decision === "allow" ? "allow" : "deny"}">${escapeHtml(c.decision)}</span>` : "";
      const resultChip = c.end == null ? `<span class="chip run">running</span>` : (c.ok ? "" : `<span class="chip fail">${escapeHtml(c.errorKind || "failed")}</span>`);
      const verb = toolVerb(c.tool);
      const sel = selected === c.id ? " selected" : "";
      html += `<div class="row${sel}" data-id="${c.id}">
        <div class="glyph ${cls}">${glyph}</div>
        <div>
          <div class="line"><span class="tool">${escapeHtml(c.tool)}</span>${verb ? `<span class="verb">${escapeHtml(verb)}</span>` : ""}${decision}${resultChip}${c.args ? `<span class="args">${escapeHtml(c.args)}</span>` : ""}${c.outcome ? `<span class="chip ok">${escapeHtml(c.outcome)}</span>` : ""}</div>
          <div class="detail">
            <div class="kv">
              <span class="k">call</span><span class="v">#${c.id}</span>
              <span class="k">tool</span><span class="v">${escapeHtml(c.tool)}</span>
              <span class="k">decision</span><span class="v">${escapeHtml(c.decision || "—")}</span>
              <span class="k">started</span><span class="v">${fmtClock(c.start)}</span>
              <span class="k">duration</span><span class="v">${fmtDur(dur)}</span>
              <span class="k">outcome</span><span class="v">${c.end == null ? "running" : (c.ok ? "ok" : "failed")}${c.outcome ? " · " + escapeHtml(c.outcome) : ""}</span>
              ${c.args ? `<span class="k">args</span><span class="v">${escapeHtml(c.args)}</span>` : ""}
            </div>
            ${c.tool.indexOf("terminal.") === 0 && c.args ? `<div class="kv" style="margin-top:10px"><span class="k">session</span><span class="v">${escapeHtml(c.args.replace(/^session=/,""))}</span><span class="k"></span><span class="v"><a class="openlink" href="/desktop/?view=terminal" target="_self">Open terminal →</a></span></div>` : ""}
            ${c.runId ? `<div class="runblock" data-run="${escapeHtml(c.runId)}">Loading run ${escapeHtml(c.runId)}…</div>` : ""}
          </div>
        </div>
        <div class="meta"><span class="dur">${fmtDur(dur)}</span><span>${fmtClock(c.end == null ? c.start : c.end)}</span></div>
      </div>`;
    });
    feed.innerHTML = html;
    feed.querySelectorAll(".row").forEach((row) => { row.onclick = () => { selected = Number(row.dataset.id); schedule(); }; });
    if (selected != null) {
      const block = feed.querySelector(`[data-id="${selected}"] [data-run]`);
      if (block && !block.dataset.loaded) void loadRun(block);
    }

    const all = order.map((id) => calls.get(id)).filter(Boolean);
    const failed = all.filter((c) => c.end != null && c.ok === false).length;
    counts.innerHTML = `<b>${all.length}</b> calls · <b>${failed}</b> failed`;
    const running = all.filter((c) => c.end == null).length;
    dot.className = "dot live";
    last.textContent = all.length + " events · " + (running ? running + " running" : "idle");
    if (follow) document.getElementById("main").scrollTop = document.getElementById("main").scrollHeight;
  }

  async function loadRun(block){
    block.dataset.loaded = "1";
    let tk = "";
    try { tk = localStorage.getItem("summriseToken") || ""; } catch {}
    try {
      const r = await fetch("/api/runs/" + encodeURIComponent(block.dataset.run), { headers: tk ? { Authorization: "Bearer " + tk } : {} });
      if (!r.ok) throw new Error("status " + r.status);
      const body = await r.json();
      const run = body.run || {};
      const argv = Array.isArray(run.args) && run.args.length ? " " + run.args.join(" ") : "";
      const code = run.exit_code === null || run.exit_code === undefined ? (run.timed_out ? "timed out" : "no exit code") : "exit " + run.exit_code;
      block.innerHTML = `<div class="kv" style="margin-top:12px">
          <span class="k">command</span><span class="v">${escapeHtml((run.command || "") + argv)}</span>
          <span class="k">cwd</span><span class="v">${escapeHtml(run.cwd || "—")}</span>
          <span class="k">result</span><span class="v">${escapeHtml(code)} · ${fmtDur(run.duration_ms || 0)}</span>
          <span class="k">output</span><span class="v">stdout ${run.stdout_bytes ?? "?"} B · stderr ${run.stderr_bytes ?? "?"} B</span>
        </div>
        ${run.stdout_preview ? `<div class="kv" style="margin-top:10px"><span class="k">stdout</span><span class="v"><pre>${escapeHtml(run.stdout_preview)}</pre></span></div>` : ""}
        ${run.stderr_preview ? `<div class="kv" style="margin-top:10px"><span class="k">stderr</span><span class="v"><pre>${escapeHtml(run.stderr_preview)}</pre></span></div>` : ""}
        <div class="note">${run.stdout_preview || run.stderr_preview ? "Preview: the first bytes the history kept, with credential shapes replaced by ***." : "This row predates previews; the history has only the sizes."}</div>`;
    } catch (e) {
      block.textContent = "run " + block.dataset.run + " unavailable (" + e.message + ")";
    }
  }

  async function loadStatus(){
    try {
      let tk = ""; try { tk = localStorage.getItem("summriseToken") || ""; } catch {}
      const r = await fetch("/api/status", { headers: tk ? { Authorization: "Bearer " + tk } : {} });
      const j = await r.json();
      version.textContent = "v" + (j.version || "—");
      where.textContent = (j.host || "device") + (j.port ? ":" + j.port : "");
    } catch { where.textContent = "device"; }
  }

  async function stream(){
    let token = "";
    try { token = localStorage.getItem("summriseToken") || ""; } catch {}
    try {
      const r = await fetch("/api/events", { headers: token ? { Authorization: "Bearer " + token } : {} });
      if (!r.ok || !r.body) throw new Error("stream " + r.status);
      conn.textContent = "stream: live";
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const step = await reader.read();
        if (step.done) break;
        buf += dec.decode(step.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n\n")) >= 0) {
          const frame = buf.slice(0, idx); buf = buf.slice(idx + 2);
          const data = frame.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).trim()).join("");
          if (!data) continue;
          try { add(JSON.parse(data)); } catch {}
        }
      }
    } catch { conn.textContent = "stream: retrying"; }
    setTimeout(stream, 2000);
  }

  document.addEventListener("keydown", (e) => {
    if (e.key === "f") { follow = !follow; }
    if (e.key === "Escape") { selected = null; schedule(); }
  });

  loadStatus(); stream(); render();
  setInterval(() => { if (document.querySelectorAll(".spinner").length) schedule(); }, 1000);
})();
</script>
</body>
</html>
