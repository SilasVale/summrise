<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Summrise</title>
<style>
  html,
  body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #131418;
    color: #ecedef;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    max-width: 640px;
    padding: 0 24px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
  }

  p {
    margin: 12px 0 0;
    font-size: 15px;
    color: #a2a3ac;
  }

  #note {
    margin-top: 10px;
  }

  #retry {
    margin-top: 22px;
    padding: 10px 22px;
    border: 0;
    border-radius: 8px;
    background: #b03a0a;
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }

  #retry:hover { background: #a63308; }
  #retry:focus-visible { outline: 2px solid #ecedef; outline-offset: 2px; }

  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #6f7078;
  }
</style>
</head>
<body>
<main>
  <h1 id="address">The Summrise device is not answering</h1>
  <p id="note">Retrying automatically</p>
  <button id="retry" type="button">Retry now</button>
  <p class="hint">This page retries on its own. If the device stays silent, check that the Summrise device service is running on the machine this window belongs to.</p>
</main>
<script>
  // The ONLY action on this page is a reload; the shell re-probes on every load (did-finish-load).
  (function () {
    "use strict";
    var query = new URLSearchParams(location.search);
    var address = query.get("address") || "this machine";
    var page = query.get("page") === "panel" ? "panel" : "activity";
    document.getElementById("address").textContent =
      "The Summrise device at " + address + " is not answering";
    document.getElementById("note").textContent =
      "Retrying automatically. The " + page + " page opens as soon as the device answers.";
    document.getElementById("retry").addEventListener("click", function () {
      location.reload();
    });
  })();
</script>
</body>
</html>
