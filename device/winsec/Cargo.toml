[package]
name = "summrise-winsec"
description = "The DACL the device's files live under on Windows: protect a file or directory, then read it back."
version.workspace = true
edition.workspace = true
publish.workspace = true

# The whole crate is `#![cfg(windows)]`: on any other target it compiles to an empty library, which
# is the point — there is no Unix code here pretending to check an ACL.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
] }
