[package]
name = "summrise-mesh"
description = "The device-to-device mesh: pinned QUIC identities, frames, and a signed rendezvous."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
axum = "0.7"
# The path's decisions — direct, the punch deadline, the relay fallback, the
# backoff and the stable-window reset — are `summrise-core`'s. The session only
# carries them out; it adds no rule of its own.
summrise-core = { path = "../core" }
ed25519-dalek = { version = "2", features = ["rand_core", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# TLS over the relay splice. `ring` and TLS 1.3 only, matching the `rustls`
# configuration `endpoint` builds; the default `aws-lc-rs` feature would put a
# second crypto provider in the build.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "log",
] }
# The STUN transaction id is 96 bits from the OS CSPRNG. `rand` is already in
# the dependency graph through quinn; taking it directly names the dependency
# instead of reaching through `rand_core`.
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }

# `oneshot` drives the broker's router without binding a socket: the same tower service axum
# builds, and the shape the HTTP tests in `broker.rs` use.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
