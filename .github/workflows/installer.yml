name: installer

# THE INSTALLER IS BUILT BY CI, NOT BY A LAPTOP. GitHub's windows-latest does not ship NSIS any
# more (it used to), so the job installs it with Chocolatey and calls the path that actually exists.
#
# THE COMPILE-TIME KEYS ARE DERIVED FROM THE SEEDS. A binary built without SUMMRISE_*_PUBKEY embeds
# the phase-1 placeholder and refuses every seed and update — the first CI-built installer failed
# exactly that way on a real machine. Deriving the public half with `summrise-release pubkey` means
# the key the build embeds and the key the sidecar is signed with cannot disagree.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z"
        required: true
        default: "0.1.6"
      channel:
        description: "stable or canary"
        required: true
        default: "canary"
      port:
        description: "HTTP port the device serves (18080 is the product's; a machine still running the pre-1.3 agent needs another)"
        required: true
        default: "18080"
  push:
    tags: ["v*"]

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-installer:
    name: the Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      # The signer is the only binary needed before the keys exist; it is cheap to build on its own.
      - name: derive the build keys from the seeds
        shell: bash
        env:
          LAUNCHER_SEED: ${{ secrets.SUMMRISE_LAUNCHER_SEED }}
          RELEASE_SEED: ${{ secrets.SUMMRISE_RELEASE_SEED }}
        run: |
          set -euo pipefail
          for name in launcher release; do
            case "$name" in
              launcher) value="${LAUNCHER_SEED:-}" ;;
              release) value="${RELEASE_SEED:-}" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::SUMMRISE_${name^^}_SEED is not set: the build needs the public half of the key it embeds"
              exit 1
            fi
            seed="$RUNNER_TEMP/$name.seed"
            printf '%s' "$value" > "$seed"
          done
          cargo build --release --manifest-path device/Cargo.toml -p summrise-release
          launcher_pub="$(device/target/release/summrise-release.exe pubkey --key-file "$RUNNER_TEMP/launcher.seed")"
          release_pub="$(device/target/release/summrise-release.exe pubkey --key-file "$RUNNER_TEMP/release.seed")"
          echo "SUMMRISE_LAUNCHER_PUBKEY=$launcher_pub" >> "$GITHUB_ENV"
          echo "SUMMRISE_RELEASE_PUBKEY=$release_pub" >> "$GITHUB_ENV"
          echo "derived launcher=$launcher_pub"
          echo "derived release=$release_pub"

      - name: build the runtime
        shell: bash
        env:
          SUMMRISE_CONSOLE_GRANT_KEY: ${{ vars.SUMMRISE_CONSOLE_GRANT_KEY }}
        run: |
          set -euo pipefail
          cargo build --release --manifest-path device/Cargo.toml \
            -p summrise-launch -p summrise-device -p summrise-console

      # The sidecar is the launcher key's statement that this exact binary is the first generation.
      - name: sign the first-generation sidecar
        shell: bash
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          CHANNEL: ${{ github.event.inputs.channel || 'canary' }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::version '$version' is not X.Y.Z"; exit 1 ;;
          esac
          device/target/release/summrise-release.exe sidecar \
            --key-file "$RUNNER_TEMP/launcher.seed" \
            --artifact device/target/release/summrise-device.exe \
            --version "$version" --channel "$CHANNEL" \
            --out device/target/release/summrise-device.sidecar.json
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: install NSIS
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          & 'C:\Program Files (x86)\NSIS\makensis.exe' -VERSION

      - name: build the installer
        shell: bash
        env:
          PORT: ${{ github.event.inputs.port || '18080' }}
        run: |
          set -euo pipefail
          makensis="/c/Program Files (x86)/NSIS/makensis.exe"
          test -x "$makensis"
          cd device/installer
          "$makensis" -DVERSION="$VERSION" -DPORT="$PORT" -DCHANNEL=canary \
            -DSOURCE="$(cygpath -w ../target/release)" summrise.nsi
          ls -l "SummriseSetup-$VERSION.exe"

      # Signing is opt-in and shell-guarded: a repository without a certificate still gets an
      # installer (unsigned, and SmartScreen will say so), and adding the two secrets turns it on
      # without editing this file.
      - name: sign the installer, when a certificate is configured
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PFX_BASE64:-}" ]; then
            echo "no signing certificate configured; the installer is unsigned"
            exit 0
          fi
          pfx="$RUNNER_TEMP/signing.pfx"
          printf '%s' "$PFX_BASE64" | base64 -d > "$pfx"
          signtool sign /f "$pfx" /p "$PFX_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 \
            "device/installer/SummriseSetup-$VERSION.exe"
          rm -f "$pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: SummriseSetup-${{ env.VERSION }}
          path: device/installer/SummriseSetup-*.exe
          if-no-files-found: error

      # A TAG RELEASE CARRIES THE INSTALLER. The artifact above is for the run; the release is what
      # an operator downloads months later.
      - name: attach the installer to the tag release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Summrise runtime $tag"
          fi
          gh release upload "$tag" device/installer/SummriseSetup-*.exe --clobber
