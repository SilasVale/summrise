name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On-demand only: the toolchain-fingerprint job below restores a 1 GB LLVM
  # tarball, far too heavy to run on every push. Dispatch it when the question
  # "is the runner's toolchain bit-identical to the release box's?" comes up.
  workflow_dispatch:

# Least privilege: CI only reads the repo (no release asset uploads here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Coverage scope (intentional gaps): the extension was removed in round 243 along with its job
# (MV3 static scripts — no build/test tooling upstream); brand/ has NO job
# (static icon assets, no build, no tests). Either is deliberately uncovered
# beyond that because neither produces a build artifact. Trigger: the PR that
# adds a build/pack step to either directory MUST add a matching CI job.
jobs:
  gateway:
    name: gateway (test + typecheck + lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: gateway
      - name: Typecheck
        run: npm run typecheck
        working-directory: gateway
      - name: Tests
        run: npm test
        working-directory: gateway
      - name: Lint
        run: npm run lint
        working-directory: gateway
      - name: Format
        run: npm run format:check
        working-directory: gateway

  ui:
    name: ui (tsc + build + test + render smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/ui/package-lock.json
      - name: Build
        run: npm ci && npm run build
        working-directory: gateway/ui
      - name: Unit tests
        run: npm test
        working-directory: gateway/ui
      - name: Render smoke (jsdom)
        run: |
          JS=$(grep -o 'index-[^"]*\.js' ../public/index.html | head -1)
          node render-smoke.mjs "../public/assets/$JS"
        working-directory: gateway/ui

  # panel-react SPA tests — previously only ran in the release workflow
  # (added round-283); every main-branch CI run must cover them too.
      # A CONSOLE SOURCE CHANGE OWES ITS BUILT ASSETS (round 178 of the standing goal). It belongs HERE rather than among the
      # repo-wide gates: it runs `npm run build`, which needs this job's `npm ci`, and its first placement failed in
      # pack-chain with "Cannot find type definition file for 'vite/client'" — a missing dependency, not a stale asset.
      - name: the console's committed assets match its source
        run: node ${{ github.workspace }}/scripts/test/console-assets-check.mjs

  panel:
    name: panel (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/resources/panel-react/package-lock.json
      - name: Install deps
        run: npm ci --include=optional
        working-directory: agent/resources/panel-react
      # P1-4: build the SPA in CI too (mirrors build.sh agent + release.yml
      # Build-before-Test order — the exe include_str!-embeds the build
      # output, so a build break must fail the PR, not the release).
      - name: Build
        run: npm run build
        working-directory: agent/resources/panel-react
      - name: Test
        run: npm test
        working-directory: agent/resources/panel-react

  # THE DESIGN SUITE, ON EVERY PUSH. Rounds 184-213 found the delivery pipeline lying to the sweep four times
  # over — a console bundle two generations old, a harness carrying a reverted change, a probe reading a
  # day-stale snapshot, a guard that could not be satisfied after a rebuild. Here the same sweep runs against
  # what this checkout BUILDS, with nothing delivered in between, so its numbers describe the code under review.
  #
  # SIX ENVIRONMENT FAULTS WERE FOUND AND FIXED BY READING THIS JOB'S LOGS, one per run: a package.json given as
  # a node-version-file; the harness emitter's exit code 2 (its SUCCESS code) read as a failure; the
  # headless-shell build; the runner living in scripts/test/ where pack-chain runs everything; a `cd` two
  # levels too deep after the runner moved one directory shallower; and a diagnostic block placed above the
  # variable it printed. The seventh was the install target, and the fix is the bare form:
  #
  #     npx playwright install --with-deps        (everything the installed playwright-core knows about)
  #
  # Naming targets was the mistake — it fetched `chromium` and asked for a build name that only the bare
  # install lays down.
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/resources/panel-react/package-lock.json
      - name: Install deps
        working-directory: agent/resources/panel-react
        run: npm ci --include=optional
      - name: Build the panel (the sweep reads the built stylesheet)
        working-directory: agent/resources/panel-react
        run: npm run build
      # THE CONSOLE ARM OF THE DESIGN SWEEP BUILDS FROM THIS CHECKOUT (round 76), so the job needs the console's
      # dependencies. It used to sweep `gateway/public` — the copy the RELEASE flow writes — which made the job's
      # verdict a statement about the last published console rather than about the commit under test.
      - name: Install deps (the console the design sweep builds)
        working-directory: gateway/ui
        run: npm ci
      - name: Install the browsers THE LOCAL KIT resolves
        working-directory: agent/resources/panel-react
        # THE PROJECT'S OWN playwright-core, NOT npx's. `npx playwright install` fetches whatever playwright
        # version npx resolves and lays down THAT build number (chromium_headless_shell-1243), while the
        # installed playwright-core asks for its own (1228) — so the install succeeded and the launch still
        # failed with "Executable doesn't exist at .../chromium_headless_shell-1228/...". Running the local
        # CLI installs the builds the local version will look for, which is the whole question.
        run: node node_modules/playwright-core/cli.js install --with-deps
      - name: Design sweep (contrast, spacing, hierarchy, typography, states)
        run: bash scripts/design-sweep-ci.bash

  agent:
    name: agent (cargo test + clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Tests
        # BOTH crates. `vale-command-core` is a FOUNDATION module (per AGENTS.md) and its
        # 29 tests were never run here — which is how a stale assertion sat failing for
        # however long: it pinned `127.0.0.2` as ServerConfig's default while the code (and
        # `netstat` on d1) say `127.0.0.1`, a claim this very file records as disproven.
        # An ungated foundation crate is a test suite that reports nothing.
        run: |
          # THE DEFAULT CONFIG TOO (round 146 of the standing goal). Only the feature set was ever exercised, so the
          # no-feature build silently stopped compiling: `exec.rs` calls `term_note_exit_code`, only the REAL terminal
          # backend had it, and the stub did not — three errors that no job could see. A configuration nobody builds is a
          # configuration that is broken.
          cargo test -p vale-agent
          cargo test -p vale-agent --features terminal,keyring
          cargo test -p vale-agent-core
        working-directory: agent
      - name: Clippy (zero warnings)
        run: |
          cargo clippy -p vale-agent --all-targets -- -D warnings
          cargo clippy -p vale-agent --features terminal,keyring --all-targets -- -D warnings
          cargo clippy -p vale-agent-core --all-targets -- -D warnings
        working-directory: agent
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: agent

  agent-e2e:
    # THE SUITE NOTHING RAN. `agent/scripts/e2e/` drives the REAL binary through
    # the product's own HTTP surface — goal -> arm the gate -> park -> approve ->
    # trail — and its `governance` section sat RED for a full round because
    # nothing executed it: round 14 inserted an `asked` event into the audit
    # sequence, no assertion was updated, and no workflow could notice. An unrun
    # test does not report drift, it accumulates it.
    #
    # Only the two PLATFORM-NEUTRAL sections run here (`governance`, `runs`):
    # they use tool calls and HTTP only. The rest are device-targeted by design
    # (PowerShell commands, `C:\ProgramData\...` path joins) and would fail on
    # the environment rather than the agent — see agent/scripts/e2e/README.md.
    #
    # Loopback only: the scratch config binds 127.0.0.1, which is also what the
    # host policy requires.
    name: agent (e2e governance + runs, real binary on loopback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the agent (terminal feature; the suite opens a real PTY)
        run: cargo build -p vale-agent --features terminal --bin vale-agent
        working-directory: agent
      - name: Write a scratch config (loopback, fixed free port)
        run: |
          mkdir -p /tmp/vale-e2e
          cat > /tmp/vale-e2e/config.yaml <<'YAML'
          server:
            host: "127.0.0.1"
            port: 18811
            name: "vale-ci-e2e"
          terminal:
            buffer_mb: 8
          YAML
      - name: Start the agent
        working-directory: agent
        run: |
          # NOTE: there is NO VALE_DATA_DIR override (paths.rs is registry-first
          # and reads no env), so the runtime dirs land beside the exe under
          # target/debug/. Fine on a fresh runner, and the reason this job needs
          # no cleanup step.
          ./target/debug/vale-agent /tmp/vale-e2e/config.yaml > /tmp/vale-e2e/agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:18811/"; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null "http://127.0.0.1:18811/" || { echo "agent never came up"; cat /tmp/vale-e2e/agent.log; exit 1; }
      - name: Run the platform-neutral sections against the real agent
        working-directory: agent
        run: |
          TOKEN=$(grep -o 'device_token: [a-f0-9]*' /tmp/vale-e2e/config.yaml | awk '{print $2}')
          test -n "$TOKEN" || { echo "no device_token in the scratch config"; exit 1; }
          node scripts/e2e/e2e.js --token "$TOKEN" --base http://127.0.0.1:18811 --only governance,runs
      - name: Show the agent log when the suite fails
        if: failure()
        run: tail -50 /tmp/vale-e2e/agent.log || true

  agent-windows-target:
    # Compile check for the Windows MSVC target (xwin pulls the SDK; separate job for caching)
    name: agent (xwin check windows-msvc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - name: Install LLVM (llvm-lib needed by ring's cc build)
        run: sudo apt-get update && sudo apt-get install -y llvm
      - name: Install cargo-xwin
        # PINNED, like release.yml:168-169. A bare install grabs whatever is newest
        # that day, so this job would validate the Windows target against a
        # different cargo-xwin than the builder uses — a new xwin that rejects the
        # current invocation fails the RELEASE having passed CI, or the reverse.
        # scripts/test/build-pins.bash keeps the two in step.
        run: cargo install cargo-xwin --locked --version 0.23.0
      - name: Xwin check
        run: cargo xwin check -p vale-agent --target x86_64-pc-windows-msvc --features terminal,keyring
        working-directory: agent

  # Pack-chain gates WITHOUT the exe/xwin (fast, well under 3 min) — the
  # release-only gates (round-298 marker, round-321 electron freshness, the
  # npm CLI tests) never ran on PRs, so a stale artifact broke the release
  # instead of the PR. Commands mirror release.yml's pack step (copy, don't
  # reinvent — working-directory agent keeps the paths identical).
  pack-chain:
    name: pack-chain (npm artifact gates, no exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # (a) round-298 marker in the COMMITTED bin/vale.js — the same grep
      # release.yml runs post-compile. Here it guards the committed file
      # itself: a src/vale.ts change without recompiling fails the PR, not
      # the release.
      # Release-lib regression: the last-5-per-minor prune + version.json
      # writer that publish-release.sh sources (extracted for testability).
      - name: release-lib regression checks
        run: bash scripts/test/release-lib.bash
      # The P0 dual-builder verdict. It was the only lib in the toolbox with NO
      # TEST, and two defects lived in it through twenty consecutive releases: a
      # one-file MODE difference reported as "packaging metadata" and PASSED, and
      # a comparison that could pass while comparing ZERO files. Both are pinned
      # here by driving the real function with `curl` stubbed (functions beat
      # PATH), so nothing about the comparison is re-implemented in the test.
      - name: release-audit regression checks
        run: bash scripts/test/release-audit.bash
      # THE SAME CHECKS UNDER A HOSTILE UMASK. tar applies the umask to extracted files unless told to
      # preserve permissions, so on a machine with umask 077 the audit's two trees both came out 0600 —
      # the modes "matched" perfectly and MODE DRIFT WAS INVISIBLE, which is the exact defect the audit
      # exists to catch. It passed on the developer's box (umask 0002) and on CI (0022) and would have
      # failed only where nobody was looking. Every bash gate runs under 077 here; they must all still
      # pass, because a gate whose verdict depends on the machine it runs on is not a gate.
      # THE SPACING SCALE, RATCHETED (round 220). Four of the objective's five design axes have rendered
      # checks; spacing had geometry and the 2.5.8 clause but nothing looked at the SCALE. Measured: 151 token
      # uses against 305 off-scale literals, so the panel's spacing is mostly ad-hoc. This holds that number
      # still — it may improve and may not get worse — because rewriting 305 declarations is a redesign, not a
      # refactor, and the one thing worth having now is that the gap stops widening.
      - name: the spacing scale may not drift
        run: node scripts/test/spacing-scale-check.mjs
      # A COLOUR THAT WAS REPLACED MAY NOT COME BACK (round 236). The palette lives in four places — three
      # stylesheets and a Rust string constant that renders the device's status page — and every existing check
      # looked at the stylesheets. That string still carried the accent round 79 retired for failing AA.
      - name: no retired colour is in use
        run: node scripts/test/retired-colours-check.mjs
      # THE LANDING PAGE IS A SURFACE TOO (round 239). It shares three token names with the panel, which is the
      # only reason the token contract ever mentioned it; no design sweep covers it, and nothing had asked
      # whether its text is readable. Its own --dsw-alias-* values are read from page.js rather than copied.
      - name: the landing page's colours, structure and layout
        run: node scripts/test/landing-check.mjs
      # EVERY HOVER MUST ANSWER A PRESS (round 246). Measured before it was written: 74 hover selectors and 3
      # press selectors — the panel answered a pointed-at cursor everywhere and a pressed one almost nowhere, so
      # the feedback on a click was whatever the network did next. It also fails a transition that names a
      # layout property, a `transition: all`, anything over 240ms, and a sheet with no reduced-motion block.
      - name: every hover answers a press
        run: node scripts/test/feedback-check.mjs
      # ONE STATE, ONE SILHOUETTE, ON BOTH SURFACES. Each surface already checked its own marks; nothing compared
      # the two languages, so the panel's diamond ("a question is waiting") and the console's ("this channel is
      # failing") could drift apart in silence — and an operator reads both. It reads the panel's vocabulary as DATA
      # (liveness.ts) and the console's as PAINTED (its sheet, with the same signature rule its own gate uses).
      - name: the two surfaces agree on one silhouette per meaning
        run: node scripts/test/mark-vocabulary-check.mjs
      # THE CHROME IS NEUTRAL AND STILL. Colour has had its gate since round 245; motion had only the
      # reduced-motion one, which asks whether an animation is SILENCED and never whether it should exist. Every
      # animation on both sheets is now declared with one of three purposes and its reason — STATE (motion that
      # describes something still happening), ENTRANCE (a thing arriving, one-shot), ATTENTION ("this changed").
      # A new animation fails until somebody writes down which it is.
      - name: the chrome is still — every animation is a declared state or acknowledgement
        run: node scripts/test/chrome-stillness-check.mjs
      # AN INSTRUCTION FILE THAT CANNOT BE READ WHOLE IS WORSE THAN A SHORT ONE. `AGENTS.md` reached 65,366 bytes
      # in round 67 and the workspace harness TRUNCATES at 65,536 — it dropped the tail, which is the Release and
      # Agent-layout sections, and nothing failed. The operational sections and the gate table stay in the
      # instruction file; the round narratives live in `docs/agents/design-ledger.md`.
      - name: the instruction file fits, and the long form is in the ledger
        run: node scripts/test/ledger-budget-check.mjs
      # THE CONSOLE'S STATE DOTS, which the panel's own guards cannot see (they read the panel's sheet). Three
      # identical circles distinguished only by fill colour, one of them 2.46:1 in the light theme — the panel
      # retired exactly this arrangement in round 245 and the console still had it (round 11 of the standing goal).
      - name: the console's state dots differ in shape, and are legible
        run: node scripts/test/console-marks-check.mjs
      # STATE COLOUR IS FOR STATE. Measured first — 163 uses of an ok/warn/fail/running/danger token across the
      # panel and console sheets, essentially all of them on the state layer, a destructive action, a category
      # lane or a token definition — and a clean result nothing enforced is one commit from not being true.
      - name: state colour only lands on state
        run: node scripts/test/state-colour-check.mjs
      # NOTHING ANIMATES FOR SOMEONE WHO ASKED FOR NO MOTION. The console set `--ds-dur: 0s` and believed it was
      # covered: that token reaches every transition written with it and NOT ONE of the four `animation:`
      # declarations, each of which carries its own duration. The panel was the model for that fix and turned out
      # to have seven of its own twelve unsilenced (round 13 of the standing goal).
      - name: motion can be turned off
        run: node scripts/test/motion-check.mjs
      # THREE COPIES OF ONE AMBIENT FIELD, held to one set of facts. The panel's and the console's are modules and
      # the landing's is inline (that page has no bundler), so the code cannot be shared — the FACTS can be, and
      # they had already drifted into the same two defects: a retired palette (`--aura-*`, read empty, falling back
      # to cyan/violet/pink behind every surface) and drawing by HUE rather than by the token's colour.
      - name: every copy of the particle field reads the brand as colours
        run: node scripts/test/particles-check.mjs
      # A MODULE'S PUBLIC SURFACE SHOULD BE WHAT SOMEBODY USES. Measured first: 67 + 9 exports were referenced
      # nowhere. Twenty-four of the panel's were used INSIDE their own file (drop the keyword), and three were used
      # nowhere at all — including the console's <StatusChip>, whose CSS family stayed behind for 35 lines.
      - name: no export that nothing imports
        run: node scripts/test/exports-check.mjs
      - name: every bash gate under a hostile umask
        run: |
          umask 077
          for g in scripts/test/*.bash; do
            echo "== $g"
            bash "$g"
          done
      # THE OTHER HOSTILE CONDITIONS, MEASURED (round 104) so they are not re-derived: all eight bash
      # gates pass under TZ=Asia/Shanghai with LC_ALL=en_US.UTF-8, and all eight pass with an
      # unreachable proxy (http_proxy/https_proxy/ALL_PROXY pointed at a dead port). The second is by
      # design — the release-path gates stub `curl` as a shell function, which is why they can drive the
      # real comparison with no network at all. Only the umask had a real defect in it, and the defect
      # was a FALSE PASS: mode drift the audit could not see on a machine whose umask was tight enough.
      # No guard is added for the three clean conditions, on purpose: they are structurally prevented by
      # code that is already tested, and a check that cannot fail is not worth its runtime.
      # The installer-ALIAS arm of the index smoke (round 126): a tgz-only
      # manifest used to make the smoke check NOTHING about the alias and still
      # print "ok", while the alias served a three-release-old installer. `curl`
      # is stubbed as a shell function, so the real smoke body runs.
      - name: smoke-index installer-alias checks
        run: bash scripts/test/smoke-index.bash
      # The hand-copied build inputs (round 128): the toolchain literal in five
      # workflow sites vs rust-toolchain.toml, cargo-xwin's pin vs release.yml's,
      # and the tgz content gates vs package.json's files[]. Each had a single
      # source of truth and NOTHING comparing them; the release audit cannot
      # backstop the toolchain one (it tolerates a differing exe by design).
      - name: build-pin drift checks
        run: bash scripts/test/build-pins.bash
      # The release orchestrator's refusal path (round 145, ledger D13): three
      # files MENTIONED publish-release.sh and every one was a source pin, so its
      # fail-closed guards had never been observed to fire. This drives the real
      # script's --audit-only entry and asserts the refusal it owns. Wired HERE in
      # round 146 because round 145 wrote the test and did not add this step — a
      # test nobody runs is the same defect class as a check that cannot fail.
      - name: publish-release refusal checks
        run: bash scripts/test/publish-release.bash
      # The installer's SHA-256 verification (round 124): the CDN fallback used
      # to hand `npm install -g` a tarball it had never hashed. The logic is
      # PowerShell, so it cannot run on this box — but GitHub's ubuntu runners
      # ship pwsh.
      #
      # A MISSING pwsh IS A FAILURE, NOT A WARNING (round 40 of the standing goal). This branch used to print
      # ::warning:: and exit 0, which is a GREEN THAT MEANS NOTHING: the installer's verification logic went untested
      # and nothing in the run could stop a merge over it. A ::warning:: is a green — the repository's own rule, written
      # for the panel audit's skip, is that a skip must not read as a pass, and `panel-audit-skip-check.mjs` exists for
      # exactly that. The wiring is still pinned independently in agent/tests/installer_integrity.rs; this step's job is
      # to run the LOGIC, and if it cannot, that is an environment failure worth seeing.
      - name: installer integrity tests (pwsh)
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::pwsh is not installed on this runner — the installer's verification LOGIC was NOT tested. Install PowerShell, or remove this step deliberately; a green here would be a lie."
            exit 1
          fi
          pwsh -NoProfile -File agent/deploy/lib/ValeIntegrity.tests.ps1
      # The model-drift report's PURE half. The report itself needs four live
      # third-party endpoints, so it can never be a CI gate — an unreachable
      # upstream would fail the build for a reason unrelated to the change. What
      # CAN run here is the normalisation and the comparison, which is where a
      # checker goes wrong quietly: the first version compared raw
      # prefix-stripped names and reported false drift on every channel.
      - name: model-drift regression checks
        run: node scripts/test/model-drift-check.mjs
      # The contrast math, pinned. Four rounds of sweeps used an ad-hoc snippet
      # retyped each time and it was wrong twice: it read a translucent
      # background as WHITE (20 of 50 findings were that), and a skip rule that
      # looked reasonable silently disabled the whole sweep and reported zero
      # findings as a pass. Both are assertions here, with the numbers they cost.
      # The functions tested are the ones the BROWSER runs — the probe embeds them
      # via Function.prototype.toString() — so this is not a copy that can drift.
      - name: contrast-probe regression checks
        run: node scripts/test/contrast-probe-check.mjs
      # A PRESS MEASURED AGAINST REST IS A HOVER WEARING A PRESS'S NAME (round 95).
      # `pressPass` took its baseline with the pointer parked away from the control, so a sheet that answered
      # `:hover` and had NO `:active` rule still produced a difference and the row read `changed: true`. Measured
      # on the device: the landing's theme toggle changes background+color on hover and NOTHING on press, and both
      # gates missed it — this pass for that reason, `feedback-check.mjs` because it did not read the landing's
      # inline sheet. The check pins the rule as a pure function AND the wiring in all three emitted artifacts.
      - name: press anchor checks
        run: node scripts/test/press-anchor-check.mjs
      # A SKIP MUST NOT LOOK LIKE A PASS — the third time this repo has had to say
      # so. `panel-render-audit.mjs` needs a Playwright runtime; where there is none
      # it emits its harness (deliberately) but it used to exit 0, and its own
      # message admitted that "a caller watching only the exit code reads this skip
      # as a pass". It now exits 2 = DID NOT RUN, distinct from 1 = ran and failed
      # and 0 = ran and clean, and this asserts the codes rather than the prose.
      # (Round 33: "a check that reads nothing must not report success". Round 46:
      # a harness that could not tell an unmocked request from an empty page.)
      - name: panel-audit skip-vs-pass checks
        run: node scripts/test/panel-audit-skip-check.mjs
      # A `var()` THAT RESOLVES TO NOTHING SILENTLY DELETES ITS DECLARATION. No
      # error, no log, the page renders — just not what the rule says. Round 43's
      # console Models page used three names that exist in the PANEL's tokens and not
      # in the console's, so a lane had no stripe and the current chip was not
      # highlighted, while every contrast sweep still read 0 under AA: a dropped
      # `color` leaves an INHERITED colour, which measures fine. A probe cannot see a
      # declaration that never applied.
      - name: dangling custom-property checks
        run: node scripts/custom-prop-check.mjs
      # THE SAME DISEASE IN THE E2E GATE, and this one was in CI on every push.
      # The suite ends on `exit(failed.length ? 1 : 0)`, so `--only` naming a
      # section that does not exist ran NOTHING, printed "== 0/0 passed ==" and
      # exited 0. One renamed section would have turned the gate into a no-op that
      # still reported success. It now validates `--only` against a declared
      # section list and exits 2 when zero checks execute.
      - name: e2e --only skip-vs-pass checks
        run: node scripts/test/e2e-only-check.mjs
      # ONE design vocabulary across the two frontends. They shared 16 token
      # NAMES and 12 of them held different VALUES — the console's frame was
      # Bootstrap's gray scale while the panel's was zinc/Apple — and the
      # console's own comment claimed they shared a vocabulary, which is what
      # stopped anyone checking. Needs no network and no build: it reads both
      # stylesheets.
      - name: token contract (console vs panel)
        run: node scripts/test/token-contract-check.mjs
      # EVERY var(--token) MUST RESOLVE, in all three UIs. An undefined custom property does not fall
      # back — it makes the whole declaration invalid at computed-value time, silently. That is how the
      # console's keyboard focus ring was invisible on every control (round 137): the rule looked
      # correct, the page looked fine, and only a rendered focus measurement found it. A missing
      # definition is a string with no counterpart, which a check is good at.
      - name: css custom properties resolve (panel, console)
        run: node scripts/test/css-vars-check.mjs
      # THE HARNESS FIXTURES ARE PART OF THE INSTRUMENT, and a fixture that cannot express a state hides
      # that state from every sweep that uses it. Round 150's example: the live session list was a fixed
      # three, so the panel's EMPTY state had no surface at all. This checks the EMITTED harness, and
      # self-tests each check against a deliberately broken copy. Needs no device and no browser.
      - name: harness fixtures can express their states
        run: node scripts/test/harness-fixture-check.mjs
      # THE OTHER TWO SWEEPS' JUDGES. `panel-design-sweep.bash` has gated the panel's judge since round 50;
      # the console's and the extension's adapter-specific rules had NO gate — the shared judge they call is
      # covered through the panel's, which is exactly why the gap was easy to miss. Each case here plants one
      # defect in a clean report and requires a failure, and each clean report requires a pass.
      - name: console and extension design judges bite
        run: bash scripts/test/sweep-judges.bash
      # Smoke-helper guards: assert_want_sha256 (shared pre-publish sha gate,
      # twin of the worker's SHA256_RE) — same convention, zero new tooling.
      # A shell script that does not PARSE is a script that cannot run — and the gates below
      # exercise test suites, not the release path. Round 28 shipped two commits with an orphan
      # `fi` in publish-release.sh and found out only when a publish was attempted.
      - name: every shell script parses
        run: bash scripts/test/script-syntax.bash
      # A COMMENT IN A STYLESHEET MUST NOT READ AS CODE. Round 87 found the console's sheet carrying
      # four `/*` and one `*/` in one region: a real rule sat inside the resulting comment and had
      # never applied, while every text-reading instrument judged it live. The panel had the other
      # shape — declaration-shaped prose that made a token resolve to a sentence (round 86).
      - name: stylesheet comment hygiene
        run: node scripts/test/stylesheet-hygiene.mjs
      # The design sweep tool packages every measurement the panel has (contrast, hierarchy,
      # landmarks, focus, geometry, reflow, names, timing). This gate proves it still EMITS a
      # script that parses and still FAILS a planted defect on every axis — no browser needed.
      - name: the design sweep tool emits and judges correctly
        run: bash scripts/test/panel-design-sweep.bash
      # THE WIRE VOCABULARY, BOTH ENDS (round 44 of the standing goal). The strings the device writes and the
      # interfaces switch on were spelled twice each, kept in step by tests that read one side. The source is
      # agent/src/vocabulary.rs; this proves the artifacts and the readers still match it. It cannot run cargo, so it
      # checks the directions that catch real drift — and it fails by name.
      - name: wire vocabulary (both ends)
        run: node scripts/test/contract-vocabulary-check.mjs
      # WHERE A PRODUCTION HOST MAY APPEAR (round 46 of the standing goal). The operator asked twice to get the
      # deployment's domain out of a PUBLIC repository; 493 occurrences across 118 files later, the honest answer is
      # that three quarters of it is the infrastructure this repository IS. So the files that may name one are DECLARED
      # with reasons, and any other file that mentions one fails here — the list may only shrink. (This comment is what
      # the gate caught first: it spelled the domain it was describing.)

      - name: production hosts are declared
        run: node scripts/test/production-host-check.mjs
      # A FIXTURE TABLE MUST NOT SAY ONE THING TWICE (round 60 of the standing goal). Round 59's `prov-dot` hunt ended
      # on a duplicate key: in a JS object the LAST one wins, so a fixture body added in round 57 never reached the page
      # and the Models page rendered its failure banner for three rounds with every other axis green.
      - name: fixture tables have no duplicate keys
        run: node scripts/test/sweep-fixture-dupes-check.mjs
      # ONE FACT, ONE DERIVATION (round 78 of the standing goal). The spine's rule was enforced by READING until now:
      # round 29 deleted a private second derivation in the trajectory view that mapped a backgrounded command to `warn`
      # while the canonical one said `bg`, so one command wore two states in one view. This fails, by file and line, any
      # production module that compares against an ending the device can report — the endings come from the generated
      # contract, and the files that merely share the WORDS are declared with their reasons.
      - name: one derivation per fact
        run: node scripts/test/one-derivation-check.mjs
      # THE UPDATE VERDICT'S CHAIN (round 79 of the standing goal). Round 29's defect was a second computation of a fact
      # the DEVICE answers, and it got the answer backwards for two devices at once. The fix routes the verdict through
      # four links in three files; this asserts all three still carry it, because one deleted field anywhere returns the
      # console to computing it itself with every other suite still green.
      - name: the device's verdict still crosses the wire
        run: node scripts/test/device-verdict-check.mjs
      # EVERY FIELD THE PANEL READS IS SPOKEN BY THE OTHER END (round 82 of the standing goal). Three of this session's
      # defects were a field name only one end knew: a page looking up `h.id` against a fixture saying `prefix:`; a crash
      # row waiting on `last_boot_kind` against `verdict:`; and `prov-dot` rendering nothing for three rounds. Its first
      # run found a fourth: `first_seq`, which the device sends, no fixture carried, and whose `> 1` branch ("the trail
      # was trimmed") had therefore never rendered anywhere.
      - name: every wire field has a source
        run: node scripts/test/wire-field-check.mjs
      # AND THE SAME RULE ON THE CONSOLE (round 100 of the standing goal), where TWO of this session's defects happened:
      # a page looking a device's health up by `h.id` against a fixture saying `prefix:`, and a crash row waiting on
      # `last_boot_kind` against `verdict:`. Both cost rounds to find by hand; the panel already had the gate.
      - name: every console wire field has a producer
        run: node scripts/test/console-wire-field-check.mjs
      # AND THE LINK WHERE THE TWO LANGUAGES MEET (round 101 of the standing goal): the gateway forwards a device's answer
      # field by field BY HAND, so a name the device stopped sending becomes `undefined` on the console with every suite
      # on both sides still green. The same rule caught real gaps one layer in, twice.
      - name: the gateway forwards fields the device spells
        run: node scripts/test/gateway-device-field-check.mjs
      # NO GATE IS ASSUMED TO BITE (round 105 of the standing goal): every gate above, broken on purpose, on every push.
      # The mutations live in that file, paired with the gate each must fail, because round 104's re-audit produced two
      # false alarms and both were the MUTATIONS rather than the gates — the fifth time in one session that a non-biting
      # mutation was about the mutation.
      - name: the two backends offer the same surface
        run: node scripts/test/stub-surface-check.mjs
      # THE TABLE THAT SAYS WHAT CI RUNS MUST MATCH WHAT CI RUNS (round 151 of the standing goal). Round 146 drifted exactly
      # here: AGENTS.md claimed the agent's checks run in "both feature sets" while the workflow ran one, and the missing
      # configuration was broken at the time.
      - name: the command table matches the workflow
        run: node scripts/test/ci-command-table-check.mjs
      # A GATE THAT RUNS MUST BE A GATE SOMEBODY NAMED (round 152 of the standing goal). AGENTS.md said "ten gates" while
      # the objective was at ten and a round later there were twelve — the drift that file itself records for the sweep's
      # check count. The count is gone; this holds the part that can be checked.
      - name: every wired gate is named in the docs
        run: node scripts/test/numbered-claims-check.mjs
      # THE CONSOLE'S SIDE OF "ONE FACT, ONE DERIVATION" (round 173 of the standing goal). The panel has had that gate since
      # round 78; the console had nothing, and round 172 found the prefix rule written nine times with two behaviours.
      - name: the console's derivations have one home each
        run: node scripts/test/console-derivation-check.mjs
      - name: every gate is broken on purpose and bites
        run: node scripts/test/gate-mutations-check.mjs
      # A DEVICE FIELD IS READ IN THE MAPPING SECTION OR NOT AT ALL (round 98 of the standing goal). Rounds 96-97 removed
      # the same duplication twice in `useSessions.ts` — a byte-identical row mapper, then the device-owned half of it
      # written three times — and this is the rule that keeps it removed: outside that section, no device field is read.
      - name: one place reads the device's session row
        run: node scripts/test/session-row-check.mjs
      - name: smoke-helper regression checks
        run: bash scripts/test/smoke-helpers.bash
      # Dup-scanner normalizer: code_lines/is_test_file/collect_files —
      # stdlib-only python, same convention (exit 0 = green).
      - name: scan-dups regression checks
        run: python3 scripts/test/scan-dups-check.py
      - name: bin/vale.js round-298 marker
        working-directory: agent
        run: grep -q "vale-release" vale-agent-npm/bin/vale.js || { echo "::error::compiled bin/vale.js missing round-298 marker — recompile src/vale.ts and commit bin/vale.js"; exit 1; }
      # (b) the SAME electron freshness gate as release.yml (the
      # typescript@5 install is ~15s) — FAIL on mismatch. typeRoots points
      # at vale-agent-npm's own @types and --noCheck skips typechecking
      # (electron's node_modules is not installed in CI) — see release.yml.
      - name: Electron src freshness (same gate as release)
        working-directory: agent
        run: |
          (cd vale-agent-npm && npm install --no-save --ignore-scripts --force typescript@5 @types/node@22)
          (cd vale-agent-npm && ./node_modules/.bin/tsc -p ../vale-desktop-electron/tsconfig.json \
            --typeRoots ./node_modules/@types --outDir /tmp/electron-fresh --noCheck)
          for F in main.js preload.js url-policy.js; do
            if ! cmp -s "/tmp/electron-fresh/${F}" "vale-desktop-electron/src/${F}"; then
              echo "::error::vale-desktop-electron/src/${F} is stale (ts source changed without recompiling) — run tsc and commit the fresh output"
              exit 1
            fi
          done
          echo "electron src freshness check OK"
          # (b2) the tsc INPUT tree holds its own committed main.js copy
          # (agent/vale-desktop-electron/src/) that the freshness gate above
          # never compares — the two copies drifted silently once. Pin them.
          # NOTE: step working-directory is agent/, so both paths are
          # agent-relative (a ../ prefix here escapes the repo and
          # false-fails on a missing file — caught live on first run).
          for F in main.js preload.js url-policy.js; do
            if ! cmp -s "vale-desktop-electron/src/${F}" "vale-agent-npm/vale-desktop-electron/src/${F}"; then
              echo "::error::electron src copy drift: agent/vale-desktop-electron/src/${F} != agent/vale-agent-npm/vale-desktop-electron/src/${F} — sync (tsc emit) and commit both"
              exit 1
            fi
          done
          echo "electron src copies in sync OK"
      # P1-2 bin/vale.js freshness (same gate as release.yml:140-143):
      # recompile src/vale.ts with the tsc the electron step installed
      # above and cmp against the committed bin/vale.js — a src change
      # without recompiling fails the PR, not the release.
      - name: bin/vale.js freshness (tsc recompile + cmp, same as release)
        working-directory: agent
        run: |
          (cd vale-agent-npm && ./node_modules/.bin/tsc -p tsconfig.json --outDir /tmp/vale-fresh-bin)
          if ! cmp -s "/tmp/vale-fresh-bin/vale.js" "vale-agent-npm/bin/vale.js"; then
            echo "::error::vale-agent-npm/bin/vale.js is stale (src/vale.ts changed without recompiling) — recompile and commit bin/vale.js"
            exit 1
          fi
          echo "bin/vale.js freshness check OK"
      # P1-5 pack + content subset gate: actually run npm pack (no exe is
      # staged in this xwin-less job, so the exe is EXCLUDED) and assert
      # the other 6 release.yml files are inside — a files[]/rename slip
      # fails the PR, not the release.
      - name: Pack + content subset gate (no exe in this job)
        working-directory: agent
        run: |
          TGZ_NAME=$(cd vale-agent-npm && npm pack 2>/dev/null | tail -n 1)
          mkdir -p /tmp/packcheck
          mv "vale-agent-npm/$TGZ_NAME" /tmp/packcheck/
          tar tzf "/tmp/packcheck/$TGZ_NAME" > /tmp/tgz-list-ci.txt
          for F in "README.md" \
                   "vale-desktop-electron/src/main.js" \
                   "vale-desktop-electron/src/preload.js" \
                   "vale-desktop-electron/src/url-policy.js" \
                   "vale-desktop-electron/icon.png" \
                   "vale-desktop-electron/icon.ico" \
                   "bin/vale.js"; do
            if ! grep -qE "(^|/)${F}$" /tmp/tgz-list-ci.txt; then
              echo "::error::packed tgz missing required file: $F"
              exit 1
            fi
          done
          echo "pack content subset check OK (6/6 — exe excluded, no xwin in this job)"
      # (c) vale-agent-npm CLI tests — deliberately NO npm ci first: the
      # package has zero dependencies and no lockfile, so npm ci would
      # fail with EUSAGE. `npm test` (node --test over node builtins) runs
      # against the committed bin/vale.js with nothing installed.
      - name: npm CLI tests
        run: npm test
        working-directory: agent/vale-agent-npm

      # (d) THE DESKTOP SHELL'S SUITE, WHICH NOTHING RAN.
      #
      # `agent/vale-desktop-electron/package.json` has defined
      # `"test": "node --test"` for as long as its one test file has existed, and
      # NO job had this working directory — every other `npm test` above and in
      # release.yml names gateway, gateway-ui, panel-react, vale-agent-npm or
      # index, and CI only COMPILES the shell. So the shell's pure security
      # predicates had no home and could not be pinned, which is precisely how an
      # origin veto with NO `$` anchor survived in main.ts while the policy
      # module beside it documented that exact bug class as fixed.
      #
      # Same shape and same zero-dependency story as (c): node --test over node
      # builtins against the committed .js, so no install step.
      - name: desktop shell tests
        run: npm test
        working-directory: agent/vale-desktop-electron

  # index worker unit tests — pure node:test, zero deps, no lockfile, so
  # NO install step (like the npm CLI tests above). Well under 2 min.
  index:
    name: index (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
        working-directory: index

  # satellite proxy behavior suites (CORS/gates/BYOK/protocol conversion)
  # + wrangler dry-run per worker + the api-relay syntax gate below.
  # (Studio retired 2026-09-06, ADR 0006 — its contract-test comment block
  # that sat here was removed; the suite lives in git history.)
  proxies:
    name: proxies (node --test + wrangler dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test zen-go
        run: node --test
        working-directory: proxies/zen-go-proxy
      - name: Test zen-us
        run: node --test
        working-directory: proxies/zen-us-proxy
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Dry-run zen-go
        run: wrangler deploy --dry-run
        working-directory: proxies/zen-go-proxy
      - name: Dry-run zen-us
        run: wrangler deploy --dry-run
        working-directory: proxies/zen-us-proxy
      # EVERY PROXY SUITE RUNS HERE, and that sentence had to be corrected twice.
      #
      # Round 231: the vrelay suite (the relay that serves THIS repository's git mirror) was
      # only syntax-checked, so it passed only when a human ran it. Round 226 had read the
      # ledger's "CI does not run these 54 tests" as a finding WITHOUT opening this file and
      # retracted it in 227 — a lesson about claims, not about counts.
      #
      # Round 71: the paragraph that recorded all that ended by asserting "`api-relay` is the one
      # subsystem here with no test step" — while the step that runs it sat three lines below, and
      # while it quoted 69 tests for a job that now runs three suites. MEASURED (round 71):
      # zen-go 15 + zen-us 13 + api-relay 70 = 98 tests, each suite with its own `node --test`
      # step above. Any number here is a reading, not a rule: re-measure before quoting it.
      # THE OUTBOUND RELAY (round 207 of the standing goal, step two of the plan the research settled): an agent dials out to
      # it and its own /mcp + /panel become reachable to whoever can reach the relay — the shape every comparable product uses
      # (Portainer Edge, VS Code tunnels, Nabu Casa, the CI runners). Six tests, in-process, loopback only.
      - name: Test vale-relay
        run: node --test
        working-directory: proxies/vale-relay
      - name: Syntax gate vale-relay
        run: node --check relay.mjs
        working-directory: proxies/vale-relay
      - name: Test api-relay
        run: node --test
        working-directory: proxies/api-relay
      - name: Syntax-check api-relay handlers
        run: |
          node --check api/proxy.js
          node --check api/zen.js
          node --experimental-strip-types --check api/git.ts
          node --experimental-strip-types --check api/github.ts
          node --experimental-strip-types --check api/gform.ts
        working-directory: proxies/api-relay

  # extension/ (browser MV3) has no build tooling — syntax gate plus the
  # pure-guard unit tests (shared.js MITM guard; DOM glue stays untested by
  # design). No build/pack step exists here, so no new toolchain is needed.
  toolchain-fingerprint:
    # Answers "does the runner build with the SAME toolchain as the release
    # box?" — the one variable still open behind the last bytes of exe drift.
    # Compares by hash instead of downloading 1 GB to the release box, whose
    # link to GitHub is far too slow for that. On demand only.
    if: github.event_name == 'workflow_dispatch'
    name: toolchain fingerprint (on demand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
      - name: Restore the LLVM tarball (same cache key as release.yml)
        uses: actions/cache@v4
        with:
          path: /tmp/llvm.tar.xz
          key: llvm-18.1.8-official-ubuntu18.04
      - name: Print the fingerprints the release box compares against
        run: |
          set -euo pipefail
          echo "== rustc =="
          rustc -vV | sed -n '1,3p'
          echo "== llvm-ar (pinned toolchain) =="
          AR="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-ar"
          sha256sum "$AR"
          echo "== LLVM tarball =="
          TB=/tmp/llvm.tar.xz
          if [ ! -s "$TB" ]; then
            echo "cache miss — downloading (1 GB, ~1 min on a runner)"
            curl -fsSL -o "$TB" \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          fi
          sha256sum "$TB"
          echo "== clang / lld extracted from it =="
          mkdir -p "$HOME/llvm18"
          tar xf "$TB" -C "$HOME/llvm18" --strip-components=1
          ls "$HOME/llvm18/bin/clang-18" "$HOME/llvm18/bin/lld" 2>/dev/null || true
          sha256sum "$HOME/llvm18/bin/clang-18" "$HOME/llvm18/bin/lld" 2>/dev/null || \
            sha256sum "$HOME/llvm18/bin/clang" "$HOME/llvm18/bin/lld-link"
          echo "== cargo-xwin =="
          cargo install cargo-xwin --locked --version 0.23.0 --quiet 2>/dev/null || true
          cargo xwin --version 2>&1 | head -1
