name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On-demand only: the toolchain-fingerprint job below restores a 1 GB LLVM
  # tarball, far too heavy to run on every push. Dispatch it when the question
  # "is the runner's toolchain bit-identical to the release box's?" comes up.
  workflow_dispatch:

# Least privilege: CI only reads the repo (no release asset uploads here).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Coverage scope (intentional gaps): the extension was removed in round 243 along with its job
# (MV3 static scripts — no build/test tooling upstream); brand/ has NO job
# (static icon assets, no build, no tests). Either is deliberately uncovered
# beyond that because neither produces a build artifact. Trigger: the PR that
# adds a build/pack step to either directory MUST add a matching CI job.
jobs:
# EVERY JOB IS BOUNDED (round 176). GitHub's default job timeout is SIX HOURS, and a gate that
# hangs — a browser that never returns, a network wait, a deadlock — would spend all of it on a
# runner that bills for it. The longest run measured while auditing the gate suite was 27 minutes
# (pack-chain, which executes the gate scripts one at a time); 45 is roughly 3x that, so a job that
# exceeds it is not slow, it is stuck.
  gateway:
    name: gateway (test + typecheck + lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # **THE CRATE'S SECOND TARGET, NAMED HERE BECAUSE THE RUNNER'S DEFAULT TOOLCHAIN DOES NOT HAVE IT.**
      # This job ran `cargo test --manifest-path gateway/wasm/Cargo.toml` on the runner's preinstalled Rust,
      # which is a HOST build: the wasm-only half of the crate (`worker.rs` and its `#[event(fetch)]` entry)
      # expanded to nothing and was never compiled. The lint step below checks that half, and it needs
      # `wasm32-unknown-unknown` — which rustup does not install by default, so the step would have failed
      # on a missing target rather than on a defect. The version matches `rust-toolchain.toml`, as every
      # other job's step does.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway/wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install deps
        run: npm ci
        working-directory: gateway
      - name: Typecheck
        run: npm run typecheck
        working-directory: gateway
      - name: Tests
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: gateway
      - name: Lint
        run: npm run lint
        working-directory: gateway
      - name: Format
        run: npm run format:check
        working-directory: gateway
      # THE GATEWAY'S RUST HALF, WHICH NO JOB RAN UNTIL NOW (2026-09-29, block ④). `gateway/wasm` holds
      # the `/api/health` route and the non-streaming translation — 9 unit tests and a `verify.mjs`
      # that runs the BUILT module against the shipping TypeScript — and a crate whose tests no job
      # invokes is a crate whose tests are decoration. **A STEP IN THIS JOB AND NOT A NEW ONE**, the
      # plan's standing rule; this job already carries the gateway's other languages.
      #
      # **AND THE TESTS WERE THE ONLY THING THIS JOB RAN (2026-10-08, found while porting the device
      # registry).** `cargo test` compiles the HOST target, so the crate's wasm-only half — `worker.rs`
      # and its `#[event(fetch)]` entry, which expand to nothing off wasm32 — was never compiled by
      # anything until a deploy. Both clippy lines below are the two targets the crate has: the host,
      # where the decisions are tested, and wasm32, where the entry point is checked. The dev
      # dependency on `wasm-bindgen` makes the second one build.
      #
      # There is deliberately NO `cargo fmt --check` here: it fails at `main` today on six pre-existing
      # files (`reliability.rs`, `request_shape.rs`, `routing.rs`, `store.rs`, `v1.rs`, `vision.rs`), and
      # a step that is red before the change it guards is a step nobody reads. Formatting those six is
      # its own commit, with nothing else in it.
      - name: Rust (translation + health route)
        run: cargo test --manifest-path gateway/wasm/Cargo.toml
      - name: Rust lint, both targets the crate has (host + wasm32)
        run: |
          cargo clippy --manifest-path gateway/wasm/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path gateway/wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  ui:
    name: ui (tsc + build + test + render smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/ui/package-lock.json
      - name: Build
        run: npm ci && npm run build
        working-directory: gateway/ui
      - name: Unit tests
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: gateway/ui
      # ONE COMMAND FOR ALL OF THEM, AND THE SET IS DISCOVERED. This step used to run
      # `render-smoke.mjs` alone, written inline; overview-render-smoke.mjs recorded the consequence
      # in its own comment — "Nothing runs this smoke in CI (ci.yml runs render-smoke.mjs only),
      # which is why the drift survived" — and by then two of its checks, one of them scene 3, the
      # file's whole point, were asserting on the empty string. A smoke that runs nowhere is worse
      # than no smoke, because its green is read as coverage.
      - name: Render smokes (jsdom) — every one, discovered
        run: node scripts/test/console-smoke-check.mjs

  # panel-react SPA tests — previously only ran in the release workflow
  # (added round-283); every main-branch CI run must cover them too.
      # A CONSOLE SOURCE CHANGE OWES ITS BUILT ASSETS (round 178 of the standing goal). It belongs HERE rather than among the
      # repo-wide gates: it runs `npm run build`, which needs this job's `npm ci`, and its first placement failed in
      # pack-chain with "Cannot find type definition file for 'vite/client'" — a missing dependency, not a stale asset.
      - name: the console's committed assets match its source
        run: node ${{ github.workspace }}/scripts/test/console-assets-check.mjs

  panel:
    name: panel (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/resources/panel-react/package-lock.json
      - name: Install deps
        run: npm ci --include=optional
        working-directory: agent/resources/panel-react
      # P1-4: build the SPA in CI too (mirrors build.sh agent + release.yml
      # Build-before-Test order — the exe include_str!-embeds the build
      # output, so a build break must fail the PR, not the release).
      - name: Build
        run: npm run build
        working-directory: agent/resources/panel-react
      - name: Test
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: agent/resources/panel-react
      # THE PANEL SHEET'S FRESHNESS (round 177, relocated round 190). Five gates read the COMMITTED
      # agent/resources/panel/panel.css and nothing compared it to its source. THIS JOB is the one that
      # installs agent/resources/panel-react's dependencies — round 190 moved it here after the `ui` job,
      # which installs only gateway/ui's, reported the missing types as a failed panel build.
      - name: Panel sheet freshness
        run: node ${{ github.workspace }}/scripts/test/panel-sheet-freshness-check.mjs

  # THE DESIGN SUITE, ON EVERY PUSH. Rounds 184-213 found the delivery pipeline lying to the sweep four times
  # over — a console bundle two generations old, a harness carrying a reverted change, a probe reading a
  # day-stale snapshot, a guard that could not be satisfied after a rebuild. Here the same sweep runs against
  # what this checkout BUILDS, with nothing delivered in between, so its numbers describe the code under review.
  #
  # SIX ENVIRONMENT FAULTS WERE FOUND AND FIXED BY READING THIS JOB'S LOGS, one per run: a package.json given as
  # a node-version-file; the harness emitter's exit code 2 (its SUCCESS code) read as a failure; the
  # headless-shell build; the runner living in scripts/test/ where pack-chain runs everything; a `cd` two
  # levels too deep after the runner moved one directory shallower; and a diagnostic block placed above the
  # variable it printed. The seventh was the install target, and the fix is the bare form:
  #
  #     npx playwright install --with-deps        (everything the installed playwright-core knows about)
  #
  # Naming targets was the mistake — it fetched `chromium` and asked for a build name that only the bare
  # install lays down.
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # **THE JUDGE IS RUST NOW (2026-10-08), AND THIS JOB NEVER HAD A RUST TOOLCHAIN.** It was Node and
      # browsers only. `scripts/design-sweep-ci.bash` no longer asks Node to decide anything: it runs
      # `summrise-sweep-judge`, whose crate is a member of the `agent` workspace, so the job needs cargo.
      # The judge is the ported half of the sweep — the half that reads a report and returns a verdict —
      # and it is invoked with `cargo run --quiet`, which is also what builds it here.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/resources/panel-react/package-lock.json
      - name: Install deps
        working-directory: agent/resources/panel-react
        run: npm ci --include=optional
      - name: Build the panel (the sweep reads the built stylesheet)
        working-directory: agent/resources/panel-react
        run: npm run build
      # THE CONSOLE ARM OF THE DESIGN SWEEP BUILDS FROM THIS CHECKOUT (round 76), so the job needs the console's
      # dependencies. It used to sweep `gateway/public` — the copy the RELEASE flow writes — which made the job's
      # verdict a statement about the last published console rather than about the commit under test.
      - name: Install deps (the console the design sweep builds)
        working-directory: gateway/ui
        run: npm ci
      - name: Install the browsers THE LOCAL KIT resolves
        working-directory: agent/resources/panel-react
        # THE PROJECT'S OWN playwright-core, NOT npx's. `npx playwright install` fetches whatever playwright
        # version npx resolves and lays down THAT build number (chromium_headless_shell-1243), while the
        # installed playwright-core asks for its own (1228) — so the install succeeded and the launch still
        # failed with "Executable doesn't exist at .../chromium_headless_shell-1228/...". Running the local
        # CLI installs the builds the local version will look for, which is the whole question.
        run: node node_modules/playwright-core/cli.js install --with-deps
      - name: Design sweep (contrast, spacing, hierarchy, typography, states)
        run: bash scripts/design-sweep-ci.bash

  agent:
    name: agent (cargo test + clippy + fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # **A WORKAROUND FOR A COMPILER BUG, WITH THE MEASUREMENT THAT FOUND IT.** rustc 1.98.1
    # (48a229cea, the pinned toolchain in `rust-toolchain.toml` — the same hash) panics while compiling
    # `summrise-agent`'s lib test on an INCREMENTAL build:
    #
    #     thread 'rustc' panicked at .../rustc_middle/src/dep_graph/graph.rs:1451:5:
    #     rustc_middle::dep_graph::graph::panic_on_forbidden_read
    #     ... query_impl::mir_for_ctfe ... optimized_mir ... exec_cache_promotions
    #     error: could not compile `summrise-agent` (lib test)
    #
    # Measured on this box, on the pinned toolchain, twice: it fires with a warm `target/`, and it does NOT
    # after `cargo clean -p summrise-agent` (706 passed, 3 failed — the three playwright tests that need a
    # free 127.0.0.1:9229, which is this box and not CI). This job restores `target/` from
    # `Swatinem/rust-cache`, which is exactly the warm state, and `main` went red on `17b5be94` — a commit
    # that touches `gateway/wasm/` ONLY, with `agent/` byte-identical to the previous green commit.
    # `CARGO_INCREMENTAL=0` keeps the dependency cache and drops the incremental one, which is the query
    # path that panics.
    #
    # **AND IT DID NOT FIX THIS FAILURE — the ICE is real and measured, and it is not what failed here.** With
    # the env var in place the `Tests` step still exited 101, and the `pack-chain` job failed in the SAME
    # place with NO cargo cache at all (its own annotation says `the umask loop failed in
    # scripts/test/all-gates.bash`, which runs these very tests). So the env var stays as the workaround for a
    # flake that was reproduced, and the DIAGNOSIS is the step below, which names the tests that failed.
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # **THE GLUE INCREMENT IS A CLAIM ABOUT A COMMIT BEFORE THE MIGRATION TOUCHED `panel.js`**, so
          # `first_screen.rs` needs the history to check it — `git show 462cfc89^:…`. Measured: that object
          # is ABSENT in the default shallow clone, and the gate failed CI while passing every local run.
          # It is this repository's oldest lesson, one level down: **the clone CI gives is not the clone a
          # developer has.** `main_shape.rs` was written for the opposite half of the same fact — its gate
          # reads `git cat-file -p HEAD`, which works shallow, and this one cannot.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      # **THE LAUNCHER'S DECISIONS, AND THEN THE TARGET ITS PLATFORM CALL LIVES ON.** `summrise-exec-argv`
      # — the crate this one is shaped after — has NO CI STEP AT ALL, so its tests have never run here.
      # This one's do, and the Windows-target clippy is what catches a `cfg(windows)` path that does not
      # compile: on 2026-10-03 the host `cargo test` was green while `cargo check --target
      # x86_64-pc-windows-msvc` had never been run once. **CLIPPY AND NOT `check`, BECAUSE
      # `all-gates.bash` EXTRACTS `cargo (test|clippy|fmt)`** — a `check` step would be a gate nobody runs.
      - name: summrise-launch's decisions (host)
        run: cargo test -p summrise-launch
        working-directory: agent
      - name: summrise-launch, for the target it is staged onto
        run: cargo clippy -p summrise-launch --target x86_64-pc-windows-msvc -- -D warnings
        working-directory: agent
      # **THE CONSOLE DEPENDENCIES, BECAUSE TWO GATES NOW BUILD AND RENDER THE CONSOLE.** Landing 3 ported
      # `console-assets-check` and `console-smoke-check` into `cargo test`, which is what made them run on
      # every change — and it is also what made this job need what only the `ui` job had. Measured in CI on
      # the first push after that landing: `console_assets` failed with "the console build itself failed
      # (rc=1)" and `console_smoke` with "4 of 4 console render smoke(s) failed", both because nothing here
      # had installed the UI's dependencies. THIS IS THE "OPTION A" DEPENDENCY THE SPEC NAMED IN §6.1 —
      # a Rust gate that spawns a toolchain has to bring that toolchain's dependencies with it, and the
      # alternative (letting the gate skip when the directory is absent) would be a gate that passes where
      # it cannot look.
      - name: console dependencies (the UI build and the render smokes' jsdom)
        run: npm ci
        working-directory: gateway/ui
      - name: Tests
        # BOTH crates. `summrise-command-core` is a FOUNDATION module (per AGENTS.md) and its
        # 29 tests were never run here — which is how a stale assertion sat failing for
        # however long: it pinned `127.0.0.2` as ServerConfig's default while the code (and
        # `netstat` on d1) say `127.0.0.1`, a claim this very file records as disproven.
        # An ungated foundation crate is a test suite that reports nothing.
        run: |
          # THE DEFAULT CONFIG TOO (round 146 of the standing goal). Only the feature set was ever exercised, so the
          # no-feature build silently stopped compiling: `exec.rs` calls `term_note_exit_code`, only the REAL terminal
          # backend had it, and the stub did not — three errors that no job could see. A configuration nobody builds is a
          # configuration that is broken.
          # **NO REDIRECTS, AND `all-gates` IS WHY.** They were added so the FIRST run's failures would be
          # on disk for the diagnostic step, and they broke a rule this repository already had: `all-gates`
          # treats "exit 0 having printed NOTHING" as a FAILURE — "a gate that says nothing has proved
          # nothing" (round 175) — so all three commands went red in the `pack-chain` job, whose umask loop
          # runs that script, while the `agent` job (which runs them directly) stayed green.
          #
          # The capture was a nice-to-have; the rule is the point. The diagnostic re-runs when it has nothing
          # to read, which is where the output comes from.
          # **`--no-fail-fast`, BECAUSE CARGO STOPS AT THE FIRST FAILING TARGET AND THE GATES LIVE IN THE
          # LATER ONES.** MEASURED 2026-10-08, on the box whose lib target fails three playwright tests for
          # want of a browser bundle:
          #
          #     cargo test -p summrise-agent                  → grep -c 'Running tests/' = 0
          #     cargo test -p summrise-agent --no-fail-fast   → grep -c 'Running tests/' = 46
          #
          # So a local `all-gates.bash` run — which derives THESE lines, verbatim, by design — reported
          # `36 ok, 2 failed` while NONE of the 46 integration binaries had run, and
          # `agent/tests/production_host.rs` refused a commit that had already been pushed. The flag is here
          # rather than in `all-gates.bash` because the two ends must run the SAME command; a local override
          # would be a second command that drifts, which is what that file's header refuses.
          cargo test -p summrise-agent --no-fail-fast
          cargo test -p summrise-agent --features terminal,keyring --no-fail-fast
          cargo test -p summrise-agent-core --no-fail-fast
          # **THE CLI'S DECISIONS (2026-10-08).** `summrise-cli` is a workspace member but deliberately NOT a
          # default member — `cargo test -p summrise-agent` never reaches it, and a test nothing runs is a test
          # that rots. It carries 88 cases ported from the npm package's `node --test` suite (68 cases) and the
          # parity harness that compares the two implementations over 162 inputs.
          cargo test -p summrise-cli --no-fail-fast
          # **THE SWEEPS' PLAN (2026-10-08).** Same story, same reason: a workspace member that is not a
          # default member is a crate no job tests unless it is named here. `summrise-sweep-plan` decides
          # which surfaces a design sweep visits and which passes measure there — the matrix that used to be
          # written out at 29 call sites in the payloads.
          cargo test -p summrise-sweep-plan --no-fail-fast
          # **THE ELECTRON SHELL'S DECISIONS (2026-10-09, landing 6b).** Same story a third time, and this
          # one was MEASURED rather than noticed: the crate carries **57 `#[test]` functions** and no job
          # named it, so none of them ran in CI. `summrise-shell-policy` is the shell's boot/auth, native
          # menu, browser-session and embedded-view policy, the loopback control server's routing, the
          # agent-lifecycle watchdog and the tray's formats — the decisions that used to sit in
          # `main.ts`. Its committed wasm is checked by `shell-policy-wasm-freshness`; THIS line is what
          # runs the source's own tests.
          cargo test -p summrise-shell-policy --no-fail-fast
        # **THE LINE MY LAST PATCH ATE.** The repo root has NO `Cargo.toml` — the crates live in `agent/` —
        # so these three commands only work from there, and `working-directory: agent` sat between them and
        # the next `- name:` step. A text-range patch that ends at the next step's name deleted it, and the
        # failure that followed read as `error: could not find \`Cargo.toml\` in
        # /home/runner/work/summrise/summrise`, which the diagnostic reported as an `::notice::` on the run
        # after. The extractor in `scripts/test/all-gates.bash` runs these commands from the ROOT, so the
        # local signal was there the whole time and this loop called it "the expected three".
        working-directory: agent
      - name: Name the failing tests
        # **A JOB LOG NEEDS A TOKEN; AN ANNOTATION DOES NOT.** This step exists because the three commands
        # above are kept PURE — a `cargo test …` line is what `scripts/test/all-gates.bash` extracts from this
        # file, so piping one in place would both drop it from that list and hide its status behind `tee`'s.
        # So the diagnostic runs AFTER a failure, in its own step, and the command starts with a VARIABLE
        # rather than the word `cargo` for the same reason.
        if: failure()
        # The re-run below is a cargo command, so it needs the same directory the step above uses — without
        # it, `|| true` swallowed `could not find Cargo.toml` and the step reported "the re-run PASSED",
        # which was the opposite of what had happened.
        working-directory: agent
        run: |
          # **AND IT SAYS WHAT IT SAW, WHATEVER THAT IS.** Two runs in a row ended with this step GREEN and
          # silent: the first run's captured files matched nothing, and the re-run passed. That is two
          # different findings and the step could not tell them apart, so now it reports the SHAPE of what it
          # found — which files exist, how big they are, and the raw tail — before it decides anything.
          echo "::notice::captured files:"
          ls -la /tmp/agent-tests.out /tmp/agent-tests-features.out /tmp/agent-core-tests.out 2>&1 || true
          for f in /tmp/agent-tests.out /tmp/agent-tests-features.out /tmp/agent-core-tests.out; do
            if [ -f "$f" ]; then
              echo "::notice::$f is $(wc -c < "$f") byte(s); last lines:"
              tail -25 "$f" | while IFS= read -r line; do echo "::notice::$line"; done
            fi
          done
          named=$(cat /tmp/agent-tests*.out /tmp/agent-core-tests.out 2>/dev/null |
            grep -cE "^test .* FAILED|^error(\[|:)|panicked at|error: could not compile" || true)
          if [ "${named:-0}" -eq 0 ]; then
            cmd="cargo test -p summrise-agent --no-fail-fast"
            $cmd > /tmp/agent-tests-rerun.out 2>&1 || true
            cp /tmp/agent-tests-rerun.out /tmp/agent-tests.out 2>/dev/null || true
            echo "::warning::nothing in the first run's output matched a failure pattern; the re-run is in /tmp/agent-tests.out"
          fi
          grep -E "^test .* FAILED|^error(\[|:)|panicked at|error: could not compile" /tmp/agent-tests.out |
            sort -u | head -25 | while IFS= read -r line; do
              echo "::error::$line"
            done
          exit 0
      - name: Clippy (zero warnings)
        run: |
          cargo clippy -p summrise-agent --all-targets -- -D warnings
          cargo clippy -p summrise-agent --features terminal,keyring --all-targets -- -D warnings
          cargo clippy -p summrise-agent-core --all-targets -- -D warnings
          cargo clippy -p summrise-cli --all-targets -- -D warnings
          cargo clippy -p summrise-sweep-plan --all-targets -- -D warnings
        working-directory: agent
      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: agent

  agent-e2e:
    # THE SUITE NOTHING RAN. `agent/scripts/e2e/` drives the REAL binary through
    # the product's own HTTP surface — goal -> arm the gate -> park -> approve ->
    # trail — and its `governance` section sat RED for a full round because
    # nothing executed it: round 14 inserted an `asked` event into the audit
    # sequence, no assertion was updated, and no workflow could notice. An unrun
    # test does not report drift, it accumulates it.
    #
    # Only the two PLATFORM-NEUTRAL sections run here (`governance`, `runs`):
    # they use tool calls and HTTP only. The rest are device-targeted by design
    # (PowerShell commands, `C:\ProgramData\...` path joins) and would fail on
    # the environment rather than the agent — see agent/scripts/e2e/README.md.
    #
    # Loopback only: the scratch config binds 127.0.0.1, which is also what the
    # host policy requires.
    name: agent (e2e governance + runs, real binary on loopback)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the agent (terminal feature; the suite opens a real PTY)
        run: cargo build -p summrise-agent --features terminal --bin summrise-agent
        working-directory: agent
      - name: Write a scratch config (loopback, fixed free port)
        run: |
          mkdir -p /tmp/summrise-e2e
          cat > /tmp/summrise-e2e/config.yaml <<'YAML'
          server:
            host: "127.0.0.1"
            port: 18811
            name: "summrise-ci-e2e"
          terminal:
            buffer_mb: 8
          YAML
      - name: Start the agent
        working-directory: agent
        run: |
          # NOTE: there is NO SUMMRISE_DATA_DIR override (paths.rs is registry-first
          # and reads no env), so the runtime dirs land beside the exe under
          # target/debug/. Fine on a fresh runner, and the reason this job needs
          # no cleanup step.
          ./target/debug/summrise-agent /tmp/summrise-e2e/config.yaml > /tmp/summrise-e2e/agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:18811/"; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null "http://127.0.0.1:18811/" || { echo "agent never came up"; cat /tmp/summrise-e2e/agent.log; exit 1; }
      - name: Run the platform-neutral sections against the real agent
        working-directory: agent
        run: |
          TOKEN=$(grep -o 'device_token: [a-f0-9]*' /tmp/summrise-e2e/config.yaml | awk '{print $2}')
          test -n "$TOKEN" || { echo "no device_token in the scratch config"; exit 1; }
          node scripts/e2e/e2e.js --token "$TOKEN" --base http://127.0.0.1:18811 --only governance,runs
      - name: Show the agent log when the suite fails
        if: failure()
        run: tail -50 /tmp/summrise-e2e/agent.log || true

  agent-windows-target:
    # Compile check for the Windows MSVC target (xwin pulls the SDK; separate job for caching)
    name: agent (xwin check windows-msvc)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      # THE SAME LLVM THE RELEASE USES, NOT THE DISTRO PACKAGE (round 193). This job validated the
      # Windows target against apt's `llvm` while release.yml refuses it: "those are per-distro builds,
      # and the resulting lld laid .data out differently (measured on 1.2.317 — a 32-byte shift plus a
      # 0x100 difference in where rust_panic landed)". The step below is a verbatim copy of the
      # release's, sharing its cache key, because the POINT is that both builders invoke the same
      # binaries — which is the reason the next step pins cargo-xwin.
      - name: Restore the LLVM tarball (same cache key as release.yml)
        uses: actions/cache@v4
        with:
          path: /tmp/llvm.tar.xz
          key: llvm-18.1.8-official-ubuntu18.04
      - name: Extract LLVM 18.1.8 (official tarball)
        run: |
          set -euo pipefail
          TB=/tmp/llvm.tar.xz
          if [ ! -s "$TB" ]; then
            curl -fsSL -o "$TB" \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          fi
          mkdir -p "$HOME/llvm18"
          tar xf "$TB" -C "$HOME/llvm18" --strip-components=1
          # ubuntu-18.04's libtinfo.so.5, which the 24.04 runner does not ship.
          curl -fsSL -o /tmp/libtinfo5.deb \
            http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2.1_amd64.deb
          dpkg-deb -x /tmp/libtinfo5.deb "$HOME/llvm18-compat"
          export LD_LIBRARY_PATH="$HOME/llvm18-compat/lib/x86_64-linux-gnu"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          "$HOME/llvm18/bin/clang" --version | head -1
      - name: Point cargo-xwin at that LLVM
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/cargo-xwin"
          ln -sf "$HOME/llvm18/bin/clang"    "$HOME/.cache/cargo-xwin/clang-cl"
          ln -sf "$HOME/llvm18/bin/lld-link" "$HOME/.cache/cargo-xwin/lld-link"
          ln -sf "$HOME/llvm18/bin/llvm-rc"  "$HOME/.cache/cargo-xwin/llvm-rc"
          AR="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-ar"
          ln -sf "$AR" "$HOME/.cache/cargo-xwin/llvm-lib"
          ln -sf "$AR" "$HOME/.cache/cargo-xwin/llvm-dlltool"
      - name: Install cargo-xwin
        # PINNED, like release.yml:168-169. A bare install grabs whatever is newest
        # that day, so this job would validate the Windows target against a
        # different cargo-xwin than the builder uses — a new xwin that rejects the
        # current invocation fails the RELEASE having passed CI, or the reverse.
        # scripts/test/build-pins.bash keeps the two in step.
        run: cargo install cargo-xwin --locked --version 0.23.0
      - name: Xwin check
        run: cargo xwin check -p summrise-agent --target x86_64-pc-windows-msvc --features terminal,keyring
        working-directory: agent

  # Pack-chain gates WITHOUT the exe/xwin (fast, well under 3 min) — the
  # release-only gates (round-298 marker, round-321 electron freshness, the
  # npm CLI tests) never ran on PRs, so a stale artifact broke the release
  # instead of the PR. Commands mirror release.yml's pack step (copy, don't
  # reinvent — working-directory agent keeps the paths identical).
  pack-chain:
    name: pack-chain (npm artifact gates, no exe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # **`fetch-depth: 0`, BECAUSE THIS JOB RUNS EVERY `scripts/test/*.bash` UNDER A HOSTILE UMASK.**
      # One of them — `rust-byte-checks.bash` — runs `index/landing/verify.mjs`, which reads its reference
      # out of git with `git show 46fa0a3f:index/src/page.js`. `actions/checkout@v4` defaults to
      # `fetch-depth: 1`, where that object does not exist: measured on a `--depth 1` clone,
      # `git show 46fa0a3f:…` exits 128 with `fatal: invalid object name '46fa0a3f'`.
      #
      # **AND IT IS THE SECOND JOB THAT NEEDED THIS FOR THE SAME COMMIT** — `proxies` got it for the byte
      # comparison step it invokes by name; this job gets it because its loop reaches that same gate
      # through a glob. Both were measured red before the depth was added.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # **THE TOOLCHAIN STEP THIS JOB NEVER HAD, AND THE TARGET IT NOW NEEDS.** The umask loop below runs
      # `all-gates.bash`, which runs every gate `ci.yml` invokes — including `cargo test` and, since
      # 2026-10-03, the zen-us entrypoint gate that needs `wasm32-unknown-unknown`. Measured in CI:
      # `error[E0463]: can't find crate for `std``. So this job was compiling the whole repository on the
      # runner's default Rust rather than the 1.98.1 the repository pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # THE CONSOLE'S DEPENDENCIES, BECAUSE A GATE HERE NEEDS THEM. `console-smoke-check.mjs` runs the
      # jsdom render smokes, and this job invokes it twice: as its own step, and from
      # `gate-mutations-check`, whose rule is that a gate must be GREEN before its mutation is applied.
      # Without them every smoke fails to LOAD ("Cannot find module 'jsdom'"), 0/4, and the mutation
      # reports "1 gate(s) unproven" — the whole job red, for four rounds, while it was green locally
      # where the ui job's node_modules is always present. Found 2026-09-24 by reproducing CI's
      # condition (hiding that directory) rather than by reading the log, which showed only the summary.
      - name: console dependencies (the render smokes' jsdom)
        run: npm ci
        working-directory: gateway/ui
      # (a) round-298 marker in the COMMITTED bin/summrise.js — the same grep
      # release.yml runs post-compile. Here it guards the committed file
      # itself: a src/summrise.ts change without recompiling fails the PR, not
      # the release.
      # Release-lib regression: the last-5-per-minor prune + version.json
      # writer that publish-release.sh sources (extracted for testability).
      - name: release-lib regression checks
        run: bash scripts/test/release-lib.bash
      # The P0 dual-builder verdict. It was the only lib in the toolbox with NO
      # TEST, and two defects lived in it through twenty consecutive releases: a
      # one-file MODE difference reported as "packaging metadata" and PASSED, and
      # a comparison that could pass while comparing ZERO files. Both are pinned
      # here by driving the real function with `curl` stubbed (functions beat
      # PATH), so nothing about the comparison is re-implemented in the test.
      - name: release-audit regression checks
        run: bash scripts/test/release-audit.bash
      # THE LANDING PAGE IS A SURFACE TOO (round 239). It shares three token names with the panel, which is the
      # only reason the token contract ever mentioned it; no design sweep covers it, and nothing had asked
      # whether its text is readable. Its own --dsw-alias-* values are read from page.js rather than copied.
      # EVERY HOVER MUST ANSWER A PRESS (round 246). Measured before it was written: 74 hover selectors and 3
      # press selectors — the panel answered a pointed-at cursor everywhere and a pressed one almost nowhere, so
      # the feedback on a click was whatever the network did next. It also fails a transition that names a
      # layout property, a `transition: all`, anything over 240ms, and a sheet with no reduced-motion block.
      # HOVER-IMPLIES-PRESS, THE TRANSITION RULES AND THE MOTION BUDGET MOVED TO RUST —
      # `agent/tests/feedback.rs`, which the `agent` job's `cargo test -p summrise-agent` runs. The step here ran
      # `scripts/test/feedback-check.mjs`, and that file is DELETED rather than left beside the new gate: two gates
      # for one rule is two gates. Both implementations were run over the same tree on SIX cases — the clean tree,
      # a hover with no press, `transition: width` on a MULTI-ARM selector, `transition: all`, a duration over
      # 240ms, and a good transition that must NOT bite — and every body is byte-identical: 763 / 150 / 135 / 139 /
      # 117 / 763 bytes. Nothing replaced the step, deliberately: a `cargo test` step here would compile the crate a
      # second time in a job with no Rust cache.
      # THE CHROME IS NEUTRAL AND STILL. Colour has had its gate since round 245; motion had only the
      # reduced-motion one, which asks whether an animation is SILENCED and never whether it should exist. Every
      # animation on both sheets is now declared with one of three purposes and its reason — STATE (motion that
      # describes something still happening), ENTRANCE (a thing arriving, one-shot), ATTENTION ("this changed").
      # A new animation fails until somebody writes down which it is.
      # THE CHROME IS STILL MOVED TO RUST — `agent/tests/chrome_stillness.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. The step here ran `scripts/test/chrome-stillness-check.mjs`, and that
      # file is DELETED rather than left beside the new gate: two gates for one rule is two gates. Before the `.mjs`
      # went, both implementations were run over the same tree (four cases, bodies `cmp`-identical: 120 / 332 / 280 /
      # 476 bytes) AND over four adversarial fixtures extracted from the Rust file (2083 / 1574 / 1867 bytes,
      # identical), so this is a move and not a second opinion.
      # THE INSTRUCTION FILE'S BUDGET MOVED TO RUST — `agent/tests/docs_budget.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. It was `scripts/test/docs-budget-check.mjs` behind a step HERE, and
      # that file is deleted rather than left beside the new gate: two gates for one rule is two gates. The two
      # were run over the same tree, on the same inputs, and agreed on the verdict and on the message text before
      # the `.mjs` went, so this is a move and not a second opinion.
      # NEITHER STEP WAS REPLACED, DELIBERATELY — the rules they enforced are now checked by a job CI already runs,
      # which is the whole reason the moves are worth making, and a `cargo test` step here would compile the crate a
      # second time in a job with no Rust cache.
      # THE CONSOLE'S STATE DOTS, which the panel's own guards cannot see (they read the panel's sheet). Three
      # identical circles distinguished only by fill colour, one of them 2.46:1 in the light theme — the panel
      # retired exactly this arrangement in round 245 and the console still had it (round 11 of the standing goal).
      # THE CONSOLE'S STATE MARKS MOVED TO RUST — `agent/tests/console_marks.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. The step here ran `scripts/test/console-marks-check.mjs`, and that
      # file is DELETED rather than left beside the new gate: two gates for one rule is two gates. Both
      # implementations were run over the same tree on SIX cases — the clean tree, four mutations that must bite
      # (the failing ink, two states with one silhouette, a FILL inside a RING, a state whose rule is gone) and one
      # that must not (a state's ink moved to a STRONGER token) — and every body is byte-identical: 125 / 121 /
      # 167 / 224 / 87 / 125 bytes. Nothing replaced the step, deliberately: a `cargo test` step here would
      # compile the crate a second time in a job with no Rust cache.
      # A COMMENT THAT ASSERTS PARITY IS NOT A COMPARISON: five files carry the same CORS allowlist, and the test
      # whose NAME claims to be the drift guard reads no gateway file at all. It is a RUST gate now
      # (`agent/tests/proxy_cors_parity.rs`, batch 6 of the P1 migration), run by the `cargo test` step in this job.
      # AND ONE DOCUMENTED NUMBER, SEVEN IMPLEMENTATIONS in three deployment units — the README states a single 30s
      # budget that nothing compared across the surfaces. Also Rust (`agent/tests/proxy_timeout_parity.rs`).

      # STATE COLOUR IS FOR STATE. Measured first — 163 uses of an ok/warn/fail/running/danger token across the
      # panel and console sheets, essentially all of them on the state layer, a destructive action, a category
      # lane or a token definition — and a clean result nothing enforced is one commit from not being true.
      # STATE COLOUR IS FOR STATE MOVED TO RUST — `agent/tests/state_colour.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. The step here ran `scripts/test/state-colour-check.mjs`, and that
      # file is DELETED rather than left beside the new gate: two gates for one rule is two gates. Both
      # implementations were run over the same tree on four cases — the clean tree, a neutral element painted
      # with a state colour, a LOUD state surface (the console's dark `--info-bg`, the half judged by
      # `loudnessOf` rather than by a selector), and a status surface that must NOT bite — and the verdict is
      # identical on all four, 153 state-colour uses read in each. One deliberate difference: the failure says
      # the rule belongs "on the list in <file>", and the Rust names the list's NEW home, because the old path
      # is the file this commit deletes. Nothing replaced the step, deliberately: a `cargo test` step here would
      # compile the crate a second time in a job with no Rust cache.
      # NOTHING ANIMATES FOR SOMEONE WHO ASKED FOR NO MOTION. The console set `--ds-dur: 0s` and believed it was
      # covered: that token reaches every transition written with it and NOT ONE of the four `animation:`
      # declarations, each of which carries its own duration. The panel was the model for that fix and turned out
      # to have seven of its own twelve unsilenced (round 13 of the standing goal).
      # MOTION CAN BE TURNED OFF MOVED TO RUST — `agent/tests/motion_check.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. The step here ran `scripts/test/motion-check.mjs`, and that file is
      # DELETED rather than left beside the new gate: two gates for one rule is two gates. Both implementations
      # were run over the same tree on FIVE cases — the clean tree, three mutations that must bite (one on the
      # panel's sheet, two on the console's) and one that must not (a global `*` while a named selector is
      # removed) — and every one is byte-identical, 103 / 352 / 467 / 356 / 103 bytes. Nothing replaced the step,
      # deliberately: a `cargo test` step here would compile the crate a second time in a job with no Rust cache.
      # THREE COPIES OF ONE AMBIENT FIELD, held to one set of facts. The panel's and the console's are modules and
      # the landing's is inline (that page has no bundler), so the code cannot be shared — the FACTS can be, and
      # they had already drifted into the same two defects: a retired palette (`--aura-*`, read empty, falling back
      # to cyan/violet/pink behind every surface) and drawing by HUE rather than by the token's colour.
      # THREE COPIES OF THE AMBIENT FIELD MOVED TO RUST — `agent/tests/particles_check.rs`, which the `agent`
      # job's `cargo test -p summrise-agent` runs. The step here ran `scripts/test/particles-check.mjs`, and that
      # file is DELETED rather than left beside the new gate: two gates for one rule is two gates. Both
      # implementations were run over the same tree on SIX cases — the clean tree and five mutations, one per
      # fact, four on the landing's Rust copy and one on the panel's TypeScript — and every body is
      # byte-identical: 198 / 185 / 196 / 262 / 222 / 201 bytes. Nothing replaced the step, deliberately: a
      # `cargo test` step here would compile the crate a second time in a job with no Rust cache.
      # A MODULE'S PUBLIC SURFACE SHOULD BE WHAT SOMEBODY USES — a RUST gate now (`agent/tests/exports_check.rs`,
      # batch 6 of the P1 migration), run by the `cargo test` step in this job. Measured first: 67 + 9 exports were
      # referenced nowhere. Twenty-four of the panel's were used INSIDE their own file (drop the keyword), and three
      # were used nowhere at all — including the console's <StatusChip>, whose CSS family stayed behind for 35 lines.
      - name: the relay deploy script's every path (stubbed, no box)
        # **THE GATE ABOVE THIS FILE'S OWN COMMENT MADE ME ADD THIS STEP.** `build-pins.bash` refuses a
        # `scripts/test/*` file that `ci.yml` never invokes — "a test nobody runs is the same defect class as
        # a check that cannot fail" — and it caught this harness the round after it was written, when the
        # umask loop's glob was the only thing reaching it. The stubs make it need nothing but bash: no
        # docker, no musl toolchain, no box.
        run: bash scripts/test/relay-deploy-stub.bash
      - name: every bash gate under a hostile umask
        run: |
          umask 077
          # A GLOB THAT MATCHED NOTHING IS NOT A CLEAN RUN (round 191). This loop s own comment above
          # claims every bash gate runs under 077; with no floor, an empty glob exits 0 and the claim
          # is untested. The same rule the gate scripts already carry (script-syntax.bash s FLOOR 20).
          set -o pipefail
          shopt -s nullglob
          gates=(scripts/test/*.bash)
          if [ ${#gates[@]} -lt 5 ]; then
            echo "::error::the umask loop selected ${#gates[@]} gate(s) — a glob that matched nothing is not a clean run"
            exit 1
          fi
          # **A LOOP THAT STOPS MUST SAY WHICH GATE STOPPED IT.** Without this the step's only output is the
          # failing gate's own text, which is in the job log — and a job log needs a token to read from
          # outside. An `::error::` annotation is PUBLIC, so the name of the gate travels with the failure.
          failed=""
          notrun=0
          for g in "${gates[@]}"; do
            echo "== $g"
            # **AND IT SHOWS WHAT THE GATE SAID, NOT ONLY ITS NAME.** `all-gates.bash` prints one `FAIL` line
            # per gate that went red, and those lines were only ever in the job log. `tee` keeps them live
            # AND on disk; `set -o pipefail` keeps the gate's own status, which is the whole point of running
            # it (`cmd && echo ok || echo FAIL` throws the status away — this file's own rule).
            #
            # **AND AN EXIT OF 2 IS `n/a`, NOT A FAILURE — MEASURED 2026-10-09, WHEN THIS LOOP WENT RED ON A
            # GATE THAT COULD NOT RUN HERE.** `scripts/test/url-policy-wasm-freshness.bash` needs `wasm-pack`
            # (a checkout has none) and exits **2** with "n/a no wasm-pack on PATH … a host without them cannot
            # make this judgement, and saying so is better than a false failure" — the convention
            # `all-gates.bash` already implements (`2) notrun=$((notrun + 1))`). This loop was written before
            # any gate it globs used it, so `! bash "$g"` read 2 as red and the job failed on a gate that had
            # declared it could not run. The count is PRINTED and floored below for the reason the empty-glob
            # check exists: "cannot run here" must never become a place a real failure can hide.
            set +e
            bash "$g" 2>&1 | tee /tmp/umask-gate.out
            st=${PIPESTATUS[0]}
            set -e
            if [ "$st" = 2 ]; then
              notrun=$((notrun + 1))
              echo "  n/a   $g (declared it cannot run here)"
              continue
            fi
            if [ "$st" != 0 ]; then
              failed="$g"
              echo "::error::the umask loop failed in $g"
              grep -E "^  FAIL|FAILED|error" /tmp/umask-gate.out | head -12 | while IFS= read -r line; do
                echo "::error::$line"
              done
              break
            fi
          done
          if [ -n "$failed" ]; then
            echo "gate $failed failed under umask 077"
            exit 1
          fi
          # **AND THE n/a COUNT IS PRINTED AND FLOORED, FOR THE SAME REASON THE GLOB IS.** A gate that says it
          # cannot run here is not evidence about the umask, so if EVERY gate said it, this step measured
          # nothing and must not report success — the same rule as `[ ${#gates[@]} -lt 5 ]` above, one level
          # down. The numbers are printed either way: "0 not runnable here" and "2 not runnable here" are
          # different claims and the reader should be able to tell them apart without opening a log.
          echo "umask 077 loop: $(( ${#gates[@]} - notrun )) of ${#gates[@]} gate(s) ran, $notrun declared they cannot run here"
          if [ "$notrun" -ge "${#gates[@]}" ]; then
            echo "::error::every gate in the umask loop declared it cannot run here — that is not a clean run"
            exit 1
          fi
      # THE OTHER HOSTILE CONDITIONS, MEASURED (round 104) so they are not re-derived: all eight bash
      # gates pass under TZ=Asia/Shanghai with LC_ALL=en_US.UTF-8, and all eight pass with an
      # unreachable proxy (http_proxy/https_proxy/ALL_PROXY pointed at a dead port). The second is by
      # design — the release-path gates stub `curl` as a shell function, which is why they can drive the
      # real comparison with no network at all. Only the umask had a real defect in it, and the defect
      # was a FALSE PASS: mode drift the audit could not see on a machine whose umask was tight enough.
      # No guard is added for the three clean conditions, on purpose: they are structurally prevented by
      # code that is already tested, and a check that cannot fail is not worth its runtime.
      # The installer-ALIAS arm of the index smoke (round 126): a tgz-only
      # manifest used to make the smoke check NOTHING about the alias and still
      # print "ok", while the alias served a three-release-old installer. `curl`
      # is stubbed as a shell function, so the real smoke body runs.
      - name: smoke-index installer-alias checks
        run: bash scripts/test/smoke-index.bash
      # The hand-copied build inputs (round 128): the toolchain literal in five
      # workflow sites vs rust-toolchain.toml, cargo-xwin's pin vs release.yml's,
      # and the tgz content gates vs package.json's files[]. Each had a single
      # source of truth and NOTHING comparing them; the release audit cannot
      # backstop the toolchain one (it tolerates a differing exe by design).
      - name: build-pin drift checks
        run: bash scripts/test/build-pins.bash
      # The release orchestrator's refusal path (round 145, ledger D13): three
      # files MENTIONED publish-release.sh and every one was a source pin, so its
      # fail-closed guards had never been observed to fire. This drives the real
      # script's --audit-only entry and asserts the refusal it owns. Wired HERE in
      # round 146 because round 145 wrote the test and did not add this step — a
      # test nobody runs is the same defect class as a check that cannot fail.
      - name: publish-release refusal checks
        run: bash scripts/test/publish-release.bash
      # The installer's SHA-256 verification (round 124): the CDN fallback used
      # to hand `npm install -g` a tarball it had never hashed. The logic is
      # PowerShell, so it cannot run on this box — but GitHub's ubuntu runners
      # ship pwsh.
      #
      # A MISSING pwsh IS A FAILURE, NOT A WARNING (round 40 of the standing goal). This branch used to print
      # ::warning:: and exit 0, which is a GREEN THAT MEANS NOTHING: the installer's verification logic went untested
      # and nothing in the run could stop a merge over it. A ::warning:: is a green — the repository's own rule, written
      # for the panel audit's skip, is that a skip must not read as a pass, and `panel-audit-skip-check.mjs` exists for
      # exactly that. The wiring is still pinned independently in agent/tests/installer_integrity.rs; this step's job is
      # to run the LOGIC, and if it cannot, that is an environment failure worth seeing.
      - name: installer integrity tests (pwsh)
        run: |
          if ! command -v pwsh >/dev/null 2>&1; then
            echo "::error::pwsh is not installed on this runner — the installer's verification LOGIC was NOT tested. Install PowerShell, or remove this step deliberately; a green here would be a lie."
            exit 1
          fi
          pwsh -NoProfile -File agent/deploy/lib/SummriseIntegrity.tests.ps1
      # The contrast math, pinned. Four rounds of sweeps used an ad-hoc snippet
      # retyped each time and it was wrong twice: it read a translucent
      # background as WHITE (20 of 50 findings were that), and a skip rule that
      # looked reasonable silently disabled the whole sweep and reported zero
      # findings as a pass. Both are assertions here, with the numbers they cost.
      # The functions tested are the ones the BROWSER runs — the probe embeds them
      # via Function.prototype.toString() — so this is not a copy that can drift.
      - name: contrast-probe regression checks
        run: node scripts/test/contrast-probe-check.mjs
      # A PRESS MEASURED AGAINST REST IS A HOVER WEARING A PRESS'S NAME (round 95).
      # `pressPass` took its baseline with the pointer parked away from the control, so a sheet that answered
      # `:hover` and had NO `:active` rule still produced a difference and the row read `changed: true`. Measured
      # on the device: the landing's theme toggle changes background+color on hover and NOTHING on press, and both
      # gates missed it — this pass for that reason, `feedback-check.mjs` because it did not read the landing's
      # inline sheet. The check pins the rule as a pure function AND the wiring in all three emitted artifacts.
      - name: press anchor checks
        run: node scripts/test/press-anchor-check.mjs
      # THE TOKEN CONTRACT IS NOT HERE ANY MORE (2026-09-30, P1 of the migration). It was the last
      # gate in this repository that could move into `cargo test`: it reads two stylesheets and
      # computes, with no dependency to spawn, and its proof lives in this repository. It is
      # `agent/tests/token_contract.rs` now, run by the `agent` job's `cargo test -p summrise-agent`
      # — the SAME step the other migrated gates run in, and a step this job does not have (no Rust
      # toolchain here). The equivalence proof is in the commit that moved it: eleven planted cases,
      # one per check plus two that must not bite, the two implementations indistinguishable on
      # every line and every verdict.
      # THE OTHER TWO SWEEPS' JUDGES. `panel-design-sweep.bash` has gated the panel's judge since round 50;
      # the console's and the extension's adapter-specific rules had NO gate — the shared judge they call is
      # covered through the panel's, which is exactly why the gap was easy to miss. Each case here plants one
      # defect in a clean report and requires a failure, and each clean report requires a pass.
      - name: console and extension design judges bite
        run: bash scripts/test/sweep-judges.bash
      # Smoke-helper guards: assert_want_sha256 (shared pre-publish sha gate,
      # twin of the worker's SHA256_RE) — same convention, zero new tooling.
      # A shell script that does not PARSE is a script that cannot run — and the gates below
      # exercise test suites, not the release path. Round 28 shipped two commits with an orphan
      # `fi` in publish-release.sh and found out only when a publish was attempted.
      - name: every shell script parses
        run: bash scripts/test/script-syntax.bash
      # AND THE POWER SHELL THAT RUNS AS ADMINISTRATOR ON A CUSTOMER'S MACHINE IS THE ONE THING NO `pwsh` HERE EVER
      # PARSED. `agent/deploy/*.ps1` is the installer, the tunnel repair and the integrity library; there is no pwsh on
      # this box, so rounds 28, 31 and 32 each checked its brackets BY HAND against the previous version — and the gate
      # above walks `git ls-files '*.sh' '*.bash'` (27 files), with `.ps1` not among them. This is the one question pwsh
      # would have answered in a second: do {} () [] balance OUTSIDE strings and comments — structural, not a parser.
      # IT IS A RUST GATE NOW (`agent/tests/powershell_structure.rs`, batch 6 of the P1 migration): the same scan, the
      # same stack, the same 13-row self-test table, run by the `cargo test` step already in this job. The step that ran
      # `powershell-structure-check.mjs` went with the file, in its own commit at 362 lines.
      # The design sweep tool packages every measurement the panel has (contrast, hierarchy,
      # landmarks, focus, geometry, reflow, names, timing). This gate proves it still EMITS a
      # script that parses and still FAILS a planted defect on every axis — no browser needed.
      - name: the design sweep tool emits and judges correctly
        run: bash scripts/test/panel-design-sweep.bash
      # ONE COMMAND FOR ALL OF THEM, LOCALLY. AGENTS.md's table lists the per-directory test commands
      # and not these gates, so "run the command the other end runs" was unsatisfiable by reading it —
      # and round 41 paid: contract-vocabulary-check failed here over a test fixture while every
      # command in the table was green. all-gates.bash DERIVES its list from this file, so a gate added
      # below is covered by it the moment it is added. It runs the gates a second time in this job, on
      # purpose: the individual steps stay because build-pins.bash requires every scripts/test file to
      # be named here, and the grader for the local capability has to be the same list CI runs.
      - name: every gate, in one command, as a developer would run them
        run: bash scripts/test/all-gates.bash
      # WHERE A PRODUCTION HOST MAY APPEAR is a RUST gate now (`agent/tests/production_host.rs`, batch 6 of the P1
      # migration): same declared list, same ratchet, same two streams — and it is run by the `cargo test` step, which
      # is already in this job. The step that ran `production-host-check.mjs` went with the file.
      # THREE STEPS, NOT THREE ORPHANED LINES (round 273). Each of these three gates was added by a separate round whose
      # commit message said "the invocation, beside production-host-check" -- and each wrote its command on the line BELOW
      # that step's `run:` instead of starting a new `- name:`/`run:` pair. YAML has no `run` key with a multi-line scalar
      # there, so the whole FILE stopped parsing: GitHub answered every push with a completed run carrying ZERO jobs and
      # `conclusion: failure`, which is indistinguishable in a count from a real red and has no log to open. Measured:
      # 8ca63398 ran 11 jobs and succeeded; e92fbf32, the first of the three, ran 0 -- and so did the ~35 commits after it.
      # `agent/tests/workflow_yaml.rs` is the gate that now fails on this shape instead of a silent two-hour outage.
      # EVERY ROUTE THE HEADER LISTS IS SERVED is a RUST gate now (`agent/tests/http_route_header.rs`, batch 7 of the
      # P1 migration), run by the `cargo test` step in this job. Round 147 made the header say "A SELECTION, NOT THE
      # INVENTORY"; the gate keeps the one direction that is checkable — a header naming a route nothing serves.
      # THE UPDATE VERDICT'S CHAIN (round 79 of the standing goal) is a RUST gate now (`agent/tests/device_verdict.rs`,
      # batch 6 of the P1 migration), run by the `cargo test` step in this job. Round 29's defect was a second computation
      # of a fact the DEVICE answers, and it got the answer backwards for two devices at once. The fix routes the verdict
      # through four links in three files; that gate asserts all three still carry it, because one deleted field anywhere
      # returns the console to computing it itself with every other suite still green.
      # THE CONSOLE'S SIDE OF "ONE FACT, ONE DERIVATION" (round 173 of the standing goal). The panel has had that gate since
      # round 78; the console had nothing, and round 172 found the prefix rule written nine times with two behaviours.
      # THE CONSOLE'S DERIVATIONS HAVE ONE HOME EACH is a RUST gate now (`agent/tests/console_derivation.rs`, batch 7
      # of the P1 migration), run by the `cargo test` step in this job. It pins `lib/lane.ts` as the only place the
      # trailing-slash strip lives, and `views/DevicesPanel.tsx` as the only place the update verdict is compared.
      # THE SESSION ROW'S CARRY LIST AND DETECT LIST must agree — a RUST gate now (`agent/tests/
      # session_carry_detect.rs`, batch 6 of the P1 migration), run by the `cargo test` step in this job.
      # They are two lists on purpose: `pendingApproval` is derived at map time, so comparing the mapped
      # objects would report a change on every poll. The bug this guards was the two disagreeing —
      # `wireFieldsChanged` omitted `idleMs` and `commandRunning` while `wireFields` carried them, so a
      # row kept its discovery values for life. Nothing compared them until the JS gate did.
      # THE TWO HALVES OF THE DEVICE-VERSION RULE are a RUST gate now (`agent/tests/device_version_rule.rs`,
      # batch 6 of the P1 migration), run by the `cargo test` step in this job. The panel and the console each decide
      # which of the device's two version fields wins, in different packages with no shared module — and BOTH were
      # broken independently: round-304 on the gateway side (the frozen Cargo `version` showed v1.0.145 forever), and
      # the panel records the other direction.
      # THE SHELL INSIDE EVERY `run:` BLOCK MOVED TO RUST — `agent/tests/workflow_shell.rs`, which the `agent`
      # job's `cargo test -p summrise-agent` runs. The step here ran `scripts/test/workflow-shell-check.mjs`, and
      # that file is DELETED rather than left beside the new gate: two gates for one rule is two gates. Both
      # implementations were run over the same tree on four cases — the clean tree, the historical unclosed-string
      # defect in a BLOCK scalar, an unclosed quote on an INLINE scalar, and a valid line that must NOT bite — and
      # the verdict is identical on all four, 82 run blocks read in each. The failure bodies are identical too,
      # after normalising the temp path the `.mjs` pasted verbatim (its own failure output differs on every run;
      # the Rust's is reproducible). Nothing replaced the step, deliberately: a `cargo test` step here would compile
      # the crate a second time in a job with no Rust cache.
      # EVERY WORKFLOW FILE IS VALID YAML MOVED TO RUST — `agent/tests/workflow_yaml.rs`, which the `agent` job's
      # `cargo test -p summrise-agent` runs. The gate above cannot see this, and that is MEASURED rather than assumed
      # (round 273): it extracts `run:` blocks, so a line with NO `run:` key is invisible to it — which is how three
      # gates wired in as orphaned lines under a previous step's `run:` left ci.yml unparseable for ~35 commits.
      # GitHub answered every push with a run carrying ZERO jobs and conclusion "failure", indistinguishable in a
      # count from a real red and with no log to open. THE STEP HERE WAS ITS OWN `- name:`/`run:` PAIR, which is the
      # shape whose absence it checks, and the Rust gate is checked the same way by being a `cargo test` target
      # rather than a line inside this file. Nothing replaced the step: a `cargo test` step here would compile the
      # crate a second time in a job with no Rust cache, and the `agent` job already runs it.
      # **THE `main advances only by merge` STEP WAS HERE, AND IT IS `agent/tests/main_shape.rs` NOW** (2026-10-03).
      # Nothing replaced it in this file, for the reason the paragraph above gives: the Rust gate is a `cargo test`
      # target, so the `agent` job runs it without compiling the crate a second time in a job with no Rust cache.
      # WHAT THE STEP SAID, KEPT BECAUSE IT IS THE RULE: MAIN IS THE ONE BRANCH WHERE A MISTAKE IS EVERYONE'S. `main`
      # had zero merge commits in its last 300 and red reached it three times (rounds 117, 128, 171), each by a status
      # thrown away one step after it was read. The pre-commit hook refuses a non-merge commit on main locally; this
      # runs server-side and cannot be bypassed with --no-verify. It is also the only half that can see a plain
      # `git merge` that FAST-FORWARDED — which creates no commit at all, so the hook never runs and main advances
      # linearly carrying the branch's non-merge commits.
      - name: main-shape works in the clone CI actually gives
        # THE STEP THAT WAS ABOVE FAILED ITS FIRST CI RUN, AND NO LOCAL RUN COULD HAVE SEEN IT. `actions/checkout@v4` defaults to
        # `fetch-depth: 1`, so the runner is SHALLOW; git grafts the boundary commit and `git rev-list --parents -n 1 HEAD`
        # answers with the SHA ALONE for a commit that has two parents. The gate used that and refused a `main` that WAS a
        # merge. It reads the commit object now, and this step builds a real shallow clone of a real repository whose HEAD
        # is a real merge — the only fixture that reproduces the graft — and asserts the gate passes there.
        #
        # It is AGENTS.md's "run the command the other end runs" one level down, and this gate was the other end.
        run: bash scripts/test/main-shape-shallow.bash
      - name: main-only-by-merge is proven on a real repository
        # THE OTHER HALF OF THE SAME RULE, and it is a SEPARATE STEP because the two halves fail differently. This one
        # installs `scripts/hooks/main-only-by-merge` as a throwaway repository's real pre-commit hook and runs six cases
        # through it — a direct commit on main refused, --amend refused, a branch commit allowed, a --no-ff merge allowed,
        # the merge really carrying two parents, and the call site asserted. It caught three defects in its own fixture on
        # first run, all recorded in its header.
        #
        # AND IT IS HERE BECAUSE `build-pins.bash` REFUSED THE TREE WITHOUT IT: a test script that no workflow invokes is a
        # test script nobody runs, and that gate said so by name — `actual: main-only-by-merge.bash, expected: none`. The
        # first version of this task created the proof and forgot the wiring; the repository's own gate caught it.
        run: bash scripts/test/main-only-by-merge.bash
      - name: the pre-commit hook finds its own repository
        # THE GUARD THAT HID AN INERT HOOK FOR MONTHS, and this is the only test that can see it. `core.hooksPath` is
        # `.githooks`, so git invokes the hook as `.githooks/pre-commit` — and the hook's `cd "$(dirname "$0")/../.."`
        # resolved that to /home/zhengsaisi, ONE LEVEL ABOVE THE REPO. The cd SUCCEEDED at the wrong place, the `||`
        # fallback never fired, the guard found no panel-design-sweep.mjs, and the hook exited 0 on its fifth line:
        # NOTHING IT CHECKS HAD RUN — no emitter, no archive rule — since it was installed.
        #
        # AND AGENTS.md's PROOF FOR IT COULD NOT HAVE CAUGHT IT: "proven by making an empty commit and watching it run".
        # A commit that succeeds looks exactly like a hook that ran and passed. This step invokes the hook the way GIT
        # does and asserts it does NOT take the inert path — the direction the old proof never looked in.
        run: bash scripts/test/hook-finds-its-repo.bash
      - name: the push guard refuses while CI is running
        # A PUSH SUPERSEDES AN IN-FLIGHT RUN: GitHub cancels it, and the cancellation is reported as `conclusion: cancelled`
        # — which a count cannot tell from a real failure. The rule has been in AGENTS.md for months and this repository
        # paid for it four times; THREE WERE THIS LOOP, twice in three rounds. So the check moved to the one place a push
        # cannot skip: `scripts/hooks/pre-push`, which `scripts/test/ci-not-in-flight.bash` proves on saved API responses
        # in both directions — including the FAIL-OPEN direction, because blocking a push over a flaky mirror is worse
        # than the slip it prevents.
        run: bash scripts/test/ci-not-in-flight.bash
      - name: smoke-helper regression checks
        run: bash scripts/test/smoke-helpers.bash
      # Dup-scanner normalizer: code_lines/is_test_file/collect_files —
      # stdlib-only python, same convention (exit 0 = green).
      - name: scan-dups regression checks
        run: python3 scripts/test/scan-dups-check.py
      - name: bin/summrise.js round-298 marker
        working-directory: agent
        run: grep -q "summrise-release" summrise-agent-npm/bin/summrise.js || { echo "::error::compiled bin/summrise.js missing round-298 marker — recompile src/summrise.ts and commit bin/summrise.js"; exit 1; }
      # (b) the SAME electron freshness gate as release.yml (the
      # typescript@5.9.3 install is ~15s) — FAIL on mismatch. typeRoots points
      # at summrise-agent-npm's own @types and --noCheck skips typechecking
      # (electron's node_modules is not installed in CI) — see release.yml.
      - name: Electron src freshness (same gate as release)
        working-directory: agent
        run: |
          (cd summrise-agent-npm && npm install --no-save --ignore-scripts --force typescript@5.9.3 @types/node@22)
          (cd summrise-agent-npm && ./node_modules/.bin/tsc -p ../summrise-desktop-electron/tsconfig.json \
            --typeRoots ./node_modules/@types --outDir /tmp/electron-fresh --noCheck)
          for F in main.js preload.js; do
            if ! cmp -s "/tmp/electron-fresh/${F}" "summrise-desktop-electron/src/${F}"; then
              echo "::error::summrise-desktop-electron/src/${F} is stale (ts source changed without recompiling) — run tsc and commit the fresh output"
              exit 1
            fi
          done
          echo "electron src freshness check OK"
          # (b2) the tsc INPUT tree holds its own committed main.js copy
          # (agent/summrise-desktop-electron/src/) that the freshness gate above
          # never compares — the two copies drifted silently once. Pin them.
          # NOTE: step working-directory is agent/, so both paths are
          # agent-relative (a ../ prefix here escapes the repo and
          # false-fails on a missing file — caught live on first run).
          for F in main.js preload.js; do
            if ! cmp -s "summrise-desktop-electron/src/${F}" "summrise-agent-npm/summrise-desktop-electron/src/${F}"; then
              echo "::error::electron src copy drift: agent/summrise-desktop-electron/src/${F} != agent/summrise-agent-npm/summrise-desktop-electron/src/${F} — sync (tsc emit) and commit both"
              exit 1
            fi
          done
          echo "electron src copies in sync OK"
      # THE WASM POLICY'S FRESHNESS, the same shape as the two checks above and
      # for the same reason: `summrise_url_policy.js` and `summrise_url_policy_bg.wasm`
      # are wasm-pack output that is COMMITTED to the package (the shell requires them
      # at run time, and a device has no compiler), so a change to
      # `agent/summrise-url-policy/` without a rebuild and a commit would ship a shell
      # whose URL/certificate policy disagrees with its own source. It arrives in the
      # same commit as the gate it runs: the step without the file made `pack-chain`
      # red for a reason that had nothing to do with a defect.
      - name: url-policy wasm freshness (rebuild + cmp)
        run: |
          # **EXIT 2 IS `n/a`, AND THE GATE SAYS SO IN ITS OWN HEADER** — the convention `all-gates.bash`
          # implements (`2) notrun=...`) and `rust-byte-checks.bash` established. MEASURED 2026-10-09: this
          # step failed on its first CI run with "n/a no wasm-pack on PATH" while the same gate exits 0 on a
          # box that has the toolchain, because a plain step reads 2 as red. The gate also names what is NOT
          # lost here: "the shipped-copy comparison above is also made by the release path, which every
          # builder runs — `publish-release.sh` and the `electron src copies in sync` loops in `ci.yml` /
          # `release.yml` compare the same files with `cmp`". So a runner without wasm-pack is told apart
          # from a stale artifact instead of being called a failure.
          set +e
          bash scripts/test/url-policy-wasm-freshness.bash
          st=$?
          set -e
          if [ "$st" = 2 ]; then
            echo "n/a — this runner has no wasm-pack; the gate's header names the cmp loops that still cover"
            echo "      the shipped copy, so this is 'cannot run here' and not 'the artifacts are stale'"
            exit 0
          fi
          exit "$st"
      # THE SECOND WASM POLICY'S FRESHNESS (landing 6b), the same shape, the same exit-2 convention and
      # the same reason — and a SEPARATE gate rather than an extension of the one above because the two
      # crates are peers that do not depend on each other, so one mutation proof cannot cover both.
      # `summrise_shell_policy.js` and `summrise_shell_policy_bg.wasm` are wasm-pack output committed to
      # the package (`main.js` requires the glue, which requires the module), so a change to
      # `agent/summrise-shell-policy/` without a rebuild and a commit would ship a shell whose decisions
      # disagree with its own source. THIS RUNNER HAS CARGO AND NO wasm-pack — MEASURED on the step above,
      # which failed its first run with "n/a no wasm-pack on PATH" — so exit 2 is `n/a` and not red, and
      # the gate's header names the `cmp` loops in publish-release.sh / this file / release.yml that still
      # compare the shipped pair on such a host.
      - name: shell-policy wasm freshness (rebuild + cmp)
        run: |
          set +e
          bash scripts/test/shell-policy-wasm-freshness.bash
          st=$?
          set -e
          if [ "$st" = 2 ]; then
            echo "n/a — this runner has no wasm-pack; the gate's header names the cmp loops that still cover"
            echo "      the shipped copy, so this is 'cannot run here' and not 'the artifacts are stale'"
            exit 0
          fi
          exit "$st"
      # P1-2 bin/summrise.js freshness (same gate as release.yml:140-143):
      # recompile src/summrise.ts with the tsc the electron step installed
      # above and cmp against the committed bin/summrise.js — a src change
      # without recompiling fails the PR, not the release.
      - name: bin/summrise.js freshness (tsc recompile + cmp, same as release)
        working-directory: agent
        run: |
          (cd summrise-agent-npm && ./node_modules/.bin/tsc -p tsconfig.json --outDir /tmp/summrise-fresh-bin)
          if ! cmp -s "/tmp/summrise-fresh-bin/summrise.js" "summrise-agent-npm/bin/summrise.js"; then
            echo "::error::summrise-agent-npm/bin/summrise.js is stale (src/summrise.ts changed without recompiling) — recompile and commit bin/summrise.js"
            exit 1
          fi
          echo "bin/summrise.js freshness check OK"
      # P1-5 pack + content subset gate: actually run npm pack (no exe is
      # staged in this xwin-less job, so the exe is EXCLUDED) and assert
      # the other 6 release.yml files are inside — a files[]/rename slip
      # fails the PR, not the release.
      - name: Pack + content subset gate (no exe in this job)
        working-directory: agent
        run: |
          TGZ_NAME=$(cd summrise-agent-npm && npm pack 2>/dev/null | tail -n 1)
          mkdir -p /tmp/packcheck
          mv "summrise-agent-npm/$TGZ_NAME" /tmp/packcheck/
          tar tzf "/tmp/packcheck/$TGZ_NAME" > /tmp/tgz-list-ci.txt
          # THE ONE OWNER (architecture round C4): summrise-agent-npm/required-in-tgz.txt, which
          # scripts/publish-release.sh and release.yml read too — this list used to be a fourth
          # verbatim copy. This job has no cargo-xwin, so summrise-agent.exe is skipped: the job
          # name says so, and build-pins.bash checks that the exception stays documented.
          REQUIRED_IN_TGZ="summrise-agent-npm/required-in-tgz.txt"
          [ -f "$REQUIRED_IN_TGZ" ] || { echo "::error::the packed-tgz content list is missing: $REQUIRED_IN_TGZ"; exit 1; }
          n=0
          while IFS= read -r F; do
            case "$F" in ''|'#'*) continue ;; esac
            # The two Windows exes, and only they: this job has no cargo-xwin, so both are absent
            # from the tgz it packs. The job name says so, and build-pins.bash checks that every
            # exception here stays documented.
            [ "$F" = "summrise-agent.exe" ] && continue
            [ "$F" = "summrise-launch.exe" ] && continue
            if ! grep -qE "(^|/)${F}$" /tmp/tgz-list-ci.txt; then
              echo "::error::packed tgz missing required file: $F"
              exit 1
            fi
            n=$((n+1))
          done < "$REQUIRED_IN_TGZ"
          echo "pack content check OK ($n files, both exes excluded — no xwin in this job)"
      # (c) summrise-agent-npm CLI tests — deliberately NO npm ci first: the
      # package has zero dependencies and no lockfile, so npm ci would
      # fail with EUSAGE. `npm test` (node --test over node builtins) runs
      # against the committed bin/summrise.js with nothing installed.
      - name: npm CLI tests
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: agent/summrise-agent-npm

      # (c2) **THE CLI'S TWO IMPLEMENTATIONS, COMPARED CASE BY CASE (2026-10-08).** `summrise-cli` is the
      # Rust port of `bin/summrise.js`'s decisions, and this is the harness that proves they agree: the SAME
      # corpus through both, 162 cases, 0 differing is the bar. It belongs HERE rather than in the `agent`
      # job because it needs BOTH ends — the committed JavaScript that a device runs (`ts.mjs` requires
      # `bin/summrise.js`, not the TypeScript source) and the Rust binary. This job already has node and a
      # toolchain, and the port's own suite runs in the `agent` job.
      #
      # It is a real gate, not a formality: on its first run it found three differences, one of which is a
      # genuine TypeScript defect (`newestOf` can return `""`, which `statusReport` renders as a channel that
      # answered rather than one that could not be checked).
      - name: the CLI's Rust and JavaScript decisions agree
        run: |
          cargo build -p summrise-cli --bin summrise-cli-parity
          node summrise-cli/parity/compare.mjs
        working-directory: agent

      # (d) THE DESKTOP SHELL'S SUITE, WHICH NOTHING RAN.
      #
      # `agent/summrise-desktop-electron/package.json` has defined
      # `"test": "node --test"` for as long as its one test file has existed, and
      # NO job had this working directory — every other `npm test` above and in
      # release.yml names gateway, gateway-ui, panel-react, summrise-agent-npm or
      # index, and CI only COMPILES the shell. So the shell's pure security
      # predicates had no home and could not be pinned, which is precisely how an
      # origin veto with NO `$` anchor survived in main.ts while the policy
      # module beside it documented that exact bug class as fixed.
      #
      # Same shape and same zero-dependency story as (c): node --test over node
      # builtins against the committed .js, so no install step.
      - name: desktop shell tests
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: agent/summrise-desktop-electron

  # index worker unit tests — pure node:test, zero deps, no lockfile, so
  # NO install step (like the npm CLI tests above). Well under 2 min.
  #
  # AND THE RUST HALF OF THIS WORKER (2026-09-29, block ④ of the migration). `index/worker/` is the
  # release-manifest derivation — the route every device's updater calls — and it is a SEPARATE crate
  # outside the agent's workspace (its cdylib must never be built for windows-msvc, the same reason
  # `panel-logic` and `ui-logic` are), so NOTHING in the agent job runs it. **A crate that no job
  # runs is how `chrome_stillness` rotted in this repository** — 690 lines written, committed and
  # never compiled, with seven clippy errors nobody saw. A STEP in the existing index job, not a new
  # job, and `all-gates.bash` DERIVES it from this line, so it runs locally too.
  index:
    name: index (node --test + cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node ${{ github.workspace }}/scripts/test/npm-test-floored.mjs
        working-directory: index
      - name: Release manifest (Rust)
        run: cargo test --manifest-path index/worker/Cargo.toml
      # THE LANDING'S ARMS ARE RENDERED, TRACKED AND SERVED, so the tree has to say what Rust renders —
      # and the check is a TEST in the crate that renders them, which is why it needs no toolchain
      # beyond cargo. (The wasm pair under index/public/summrise-agent/landing/ is rebuilt by
      # `build.sh index` at deploy time; checking THAT here would mean installing wasm-bindgen and
      # binaryen in this job.)
      - name: The landing (Rust renders its arms, and they are fresh)
        run: cargo test --manifest-path index/landing/Cargo.toml

  # satellite proxy behavior suites (CORS/gates/BYOK/protocol conversion)
  # + wrangler dry-run per worker + the api-relay syntax gate below.
  # (Studio retired 2026-09-06, ADR 0006 — its contract-test comment block
  # that sat here was removed; the suite lives in git history.)
  proxies:
    name: proxies (node --test + wrangler dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # **`fetch-depth: 0`, BECAUSE ONE OF THE BYTE COMPARISONS READS A COMMIT OUT OF GIT.**
      # `index/landing/verify.mjs` does `git show 46fa0a3f:index/src/page.js` — the page as the LIVE site
      # rendered it — and `actions/checkout@v4` defaults to `fetch-depth: 1`, where that object does not
      # exist at all. **IT IS THE `agent/tests/first_screen.rs` HAZARD AGAIN**: that gate failed its first
      # CI run while passing every local one, for exactly this reason, and the `agent` job has carried
      # `fetch-depth: 0` since. Measured 2026-10-05, wiring these harnesses into CI for the first time.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # **THE TOOLCHAIN STEP THIS JOB NEVER NEEDED, AND THE TARGET IT NOW DOES.** It ran `cargo test` on the
      # runner's default Rust; the entrypoint gate added 2026-10-03 needs `wasm32-unknown-unknown`, and
      # measured in CI: `error[E0463]: can't find crate for `std`` — exit 101 in this job and in `pack-chain`,
      # whose umask loop runs `all-gates.bash`. Pinning 1.98.1 is what the other three Rust jobs do, so this
      # is also the first time this job compiles with the toolchain the repository pins.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown
      # **THE TWO `node --test` STEPS ARE GONE, AND THEIR SUITES WENT WITH THE JAVASCRIPT (2026-10-08).**
      # `proxies/zen-{us,go}-proxy/test/behavior.test.mjs` imported `../src/index.js` — the shipping
      # implementation — and both were deleted after the port was proven equal to them byte for byte on 17
      # cases each.
      #
      # **AND THE PROOF IS A RUST TEST NOW.** Those harnesses were ~400-line `.mjs` files doing three jobs
      # at once: running the built wasm module, holding the cases, and judging the bytes. **ONLY THE FIRST
      # NEEDS JAVASCRIPT** — it is `gateway/wasm/run-cases.mjs`, a runner that takes a spec and prints what
      # the module did — and the other two are `proxies/zen-{us,go}-proxy/worker/tests/differential.rs`,
      # run by the two `cargo test` steps below. The expected bytes are `worker/shipping-answers.json`:
      # what the shipping JavaScript answered, recorded on a run where both sides agreed on all 17 cases.
      #
      # THE zen-us POLICY IS IN RUST (block ④, 2026-09-29): the origin allowlist, the loopback rule and
      # the secret redaction live in `proxies/zen-us-proxy/worker`, and the two Rust gates that read them
      # — `agent/tests/proxy_cors_parity.rs` and `agent/tests/proxy_timeout_parity.rs` — were re-pointed
      # at those sources in the same change rather than left reading a file that no longer exists.
      # A STEP IN THIS JOB AND NOT A NEW ONE: the plan's standing rule is no new CI job.
      #
      # **THE CACHE-BIN STEP COMES FIRST NOW, AND THAT IS AN ORDERING REQUIREMENT RATHER THAN A
      # PREFERENCE.** `rust-byte-checks.bash` is what INSTALLS `worker-build` when it is missing (a
      # several-minute build, cached between runs), and the differentials below SPAWN it: `worker-build`'s
      # output is exactly what `run-cases.mjs` executes. Where the step used to sit — after `Test zen-us` —
      # a cold cache meant the first differential ran with no toolchain to build the module it drives.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: every Rust/JS byte comparison
        run: bash scripts/test/rust-byte-checks.bash
      - name: Test zen-us (policy + the differential)
        run: cargo test --manifest-path proxies/zen-us-proxy/worker/Cargo.toml
      # **THE HALF `cargo test` CANNOT SEE.** `worker.rs` is behind `#[cfg(target_arch = "wasm32")]`
      # because `#[event(fetch)]` expands to nothing on the host, so the host build compiles NONE of the
      # entrypoint — measured 2026-10-03: the first version of that file used `Response::builder()...
      # with_body()`, which does not exist, and the host suite was green while the target it serves did
      # not compile. **CLIPPY AND NOT `check`, BECAUSE `all-gates.bash` EXTRACTS `cargo (test|clippy|fmt)`
      # AND A `cargo check` STEP WOULD BE A GATE NOBODY RUNS BY HAND.**
      - name: zen-us's entrypoint, for the target it serves
        run: cargo clippy --manifest-path proxies/zen-us-proxy/worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # AND zen-go's TRANSLATION, which is the half of the satellite that converts a request and
      # encodes a response. A STEP IN THIS JOB, for the same reason as the one above: the plan's
      # standing rule is no new CI job, and this job already carries both languages for these workers.
      # **THE HALF `cargo test` CANNOT SEE**, for the same reason as zen-us's step above: `worker.rs` is
      # behind `#[cfg(target_arch = "wasm32")]`, so the host build compiles none of the entrypoint. The
      # job's toolchain already carries the target.
      - name: zen-go's entrypoint, for the target it serves
        run: cargo clippy --manifest-path proxies/zen-go-proxy/worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      - name: Test zen-go (translation + the differential)
        run: cargo test --manifest-path proxies/zen-go-proxy/worker/Cargo.toml
      # AND api-relay's ROUTING, which is the FIRST piece of the relay to move (2026-09-30). This one
      # is not a Worker at all — `proxies/README.md` says it in its own words ("api-relay is separate —
      # it ships to the VPS, not to Cloudflare") and the plan's P3 note names it as the highest-risk
      # item in the migration. `server/routing.mjs` is where the move starts because the module says
      # what it is: "pure URL routing + entry plumbing helpers", with its own test file.
      # A STEP IN THIS JOB, for the same reason as the two above: no new CI job, and this job already
      # carries the relay's JavaScript suite (`node --test` in `proxies/api-relay`), which is the
      # ORACLE the committed fixture was generated from.
      - name: Test api-relay routing (Rust)
        run: cargo test --manifest-path proxies/api-relay/relay/Cargo.toml
      - name: Install wrangler (pinned)
        # A BARE MAJOR IS A MOVING TARGET (round 195). This installed `wrangler@4` — whatever 4.x was
        # newest that day — and validated the proxies with it, while the deploy box runs 4.127.0: TEN
        # minor versions apart, measured when this pin was written. A wrangler that changes dry-run
        # behaviour fails the RELEASE having passed CI, or the reverse. The repo already pins rust,
        # cargo-xwin and typescript for exactly this reason; build-pins.bash holds all four together.
        run: npm install -g wrangler@4.127.0
      - name: Dry-run zen-go
        run: wrangler deploy --dry-run
        working-directory: proxies/zen-go-proxy
      - name: Dry-run zen-us
        run: wrangler deploy --dry-run
        working-directory: proxies/zen-us-proxy
      # **THE FILE RELAY — AND UNTIL THESE STEPS, NOTHING RAN IT (measured 2026-10-08).**
      # `relay/` is a Cloudflare worker (`summrise-relay`, the `/files/*` route), and `ci.yml` had NO step
      # for it: the suites under `proxies/` run, the worker under `index/` runs, and this one was in
      # neither — `node --test` in `relay/` answers `fail 0` by hand and answered nothing at all in CI.
      # **A GATE NOBODY RUNS IS A GATE NOBODY HAS**, which is the sentence `rust-byte-checks.bash` was
      # written for.
      #
      # IT IS IN THIS JOB RATHER THAN A NEW ONE (the plan's standing rule is no new CI job), and the job's
      # NAME is the only thing that does not say so: this is the job that already carries the other
      # workers' `node --test` suites, their wrangler dry-runs and their cargo tests.
      #
      # **AND TWO OF THE STEPS THAT STOOD HERE EXPIRED WITH THE 2026-10-08 CUTOVER, WHICH IS WHAT THEY
      # SAID THEY WOULD DO**: `node --test` ran the JavaScript suite and the syntax gate checked the two
      # source files, and both the suite and the sources are deleted — the port they were proving is now
      # the entry point, and the corpus check that re-recorded from the shipping JavaScript retired with
      # the file it recorded from. **The Rust differential is what carries the proof now**: it drives the
      # BUILT module and compares it against `worker/*-corpus.json`, the answers recorded on a run where
      # both implementations agreed.
      - name: Dry-run the file relay
        run: wrangler deploy --dry-run
        working-directory: relay
      - name: The file relay's decision half (Rust)
        run: cargo test --manifest-path relay/worker/Cargo.toml
      # **THE HALF `cargo test` CANNOT SEE**, and the same step the two satellites carry: `worker.rs` is
      # behind `#[cfg(target_arch = "wasm32")]` (because `#[event(fetch)]` expands to nothing on the host),
      # so the host suite compiles none of the entry point. The job's toolchain already carries the target.
      - name: The file relay's entry point, for the target it serves
        run: cargo clippy --manifest-path relay/worker/Cargo.toml --target wasm32-unknown-unknown -- -D warnings
      # EVERY PROXY SUITE RUNS HERE, and that sentence had to be corrected twice.
      #
      # Round 231: the vrelay suite (the relay that serves THIS repository's git mirror) was
      # only syntax-checked, so it passed only when a human ran it. Round 226 had read the
      # ledger's "CI does not run these 54 tests" as a finding WITHOUT opening this file and
      # retracted it in 227 — a lesson about claims, not about counts.
      #
      # Round 71: the paragraph that recorded all that ended by asserting "`api-relay` is the one
      # subsystem here with no test step" — while the step that runs it sat three lines below, and
      # while it quoted 69 tests for a job that now runs three suites. MEASURED (round 71):
      # zen-go 15 + zen-us 13 + api-relay 70 = 98 tests, each suite with its own `node --test`
      # step above. Any number here is a reading, not a rule: re-measure before quoting it.
      # **RE-MEASURED 2026-10-08, WHEN THE FIRST TWO OF THOSE SUITES WERE DELETED WITH THE JAVASCRIPT
      # THEY TESTED**: summrise-relay 8 + api-relay 73 = **81 tests, in two suites**, each with its own
      # `node --test` step below. The rule is why this line was re-run rather than adjusted.
      # THE OUTBOUND RELAY (round 207 of the standing goal, step two of the plan the research settled): an agent dials out to
      # it and its own /mcp + /panel become reachable to whoever can reach the relay — the shape every comparable product uses
      # (Portainer Edge, VS Code tunnels, Nabu Casa, the CI runners). Six tests, in-process, loopback only.
      - name: Test summrise-relay
        run: node --test
        working-directory: proxies/summrise-relay
      - name: Syntax gate summrise-relay
        run: node --check relay.mjs
        working-directory: proxies/summrise-relay
      - name: Test api-relay
        run: node --test
        working-directory: proxies/api-relay
      - name: Syntax-check api-relay handlers
        run: |
          node --check api/proxy.js
          node --check api/zen.js
          node --experimental-strip-types --check api/git.ts
          node --experimental-strip-types --check api/github.ts
          node --experimental-strip-types --check api/gform.ts
        working-directory: proxies/api-relay

  # extension/ (browser MV3) has no build tooling — syntax gate plus the
  # pure-guard unit tests (shared.js MITM guard; DOM glue stays untested by
  # design). No build/pack step exists here, so no new toolchain is needed.
  toolchain-fingerprint:
    # Answers "does the runner build with the SAME toolchain as the release
    # box?" — the one variable still open behind the last bytes of exe drift.
    # Compares by hash instead of downloading 1 GB to the release box, whose
    # link to GitHub is far too slow for that. On demand only.
    if: github.event_name == 'workflow_dispatch'
    name: toolchain fingerprint (on demand)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: llvm-tools
      - name: Restore the LLVM tarball (same cache key as release.yml)
        uses: actions/cache@v4
        with:
          path: /tmp/llvm.tar.xz
          key: llvm-18.1.8-official-ubuntu18.04
      - name: Print the fingerprints the release box compares against
        run: |
          set -euo pipefail
          echo "== rustc =="
          rustc -vV | sed -n '1,3p'
          echo "== llvm-ar (pinned toolchain) =="
          AR="$(rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin/llvm-ar"
          sha256sum "$AR"
          echo "== LLVM tarball =="
          TB=/tmp/llvm.tar.xz
          if [ ! -s "$TB" ]; then
            echo "cache miss — downloading (1 GB, ~1 min on a runner)"
            curl -fsSL -o "$TB" \
              https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          fi
          sha256sum "$TB"
          echo "== clang / lld extracted from it =="
          mkdir -p "$HOME/llvm18"
          tar xf "$TB" -C "$HOME/llvm18" --strip-components=1
          # EVERY LINE NAMES WHAT IT HASHED (round 198). This was `sha256sum A B || sha256sum C D`:
          # when the first pair was absent the fallback printed two OTHER files under the same label,
          # so a human comparing against the release box could match a hash that described a different
          # binary. `|| true` above it hid the absence entirely, and absence and presence printed the same.
          for f in "$HOME/llvm18/bin/clang-18" "$HOME/llvm18/bin/clang" \
                   "$HOME/llvm18/bin/lld" "$HOME/llvm18/bin/lld-link"; do
            if [ -f "$f" ]; then sha256sum "$f"; else echo "ABSENT: $f"; fi
          done
          echo "== cargo-xwin =="
          # AND THE VERSION MUST BE THE ONE THIS STEP INSTALLED (round 198). `|| true` let a failed
          # install fall through to whatever the runner already had, so the printed version described a
          # binary this job never fetched — a fingerprint about the wrong tool. A failed install must fail.
          cargo install cargo-xwin --locked --version 0.23.0 --quiet
          cargo xwin --version 2>&1 | head -1
