name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device:
    name: device (core + app + launcher + mesh + release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: device
      # **THE STEPS NAME THE WORKSPACE BY `--manifest-path` RATHER THAN `working-directory: device`.**
      # A command that resolves its own manifest runs the same from the repository root, from
      # `device/`, or from a script that stands somewhere else — which is what keeps a local run and
      # this job from drifting apart. `working-directory: device` would make the command correct only
      # in this file, and the same command pasted into a terminal would fail.
      - name: the device workspace (unit tests)
        run: cargo test --manifest-path device/Cargo.toml -p summrise-core -p summrise-device -p summrise-launch -p summrise-mesh -p summrise-release -p summrise-console -p summrise-winsec -p summrise-winsys -p summrise-shell
      # **PHASE 2'S FLOOR, RUN RATHER THAN UNIT-TESTED.** The same binary the Windows service runs
      # starts with a throwaway install/data pair and serves `/api/health` and its panel on Linux.
      # The Windows job still owns the service, installer and swap; this owns "the portable half
      # boots", which no test that only calls functions can prove.
      - name: the device core serves on Linux
        run: ./scripts/device-unix-smoke.sh
      # The systemd unit is what makes that binary a service; verify its syntax and ExecStart with
      # the binary this job just built, without root or a running systemd.
      - name: the Linux service unit is valid
        run: ./scripts/verify-linux-unit.sh
      # The macOS LaunchDaemon is the other half of the service adapter; its plist is XML and its
      # required keys are checkable on Linux.
      - name: the macOS LaunchDaemon plist is valid
        run: ./scripts/verify-macos-plist.sh
      # The browser pack is a product asset on every platform. This checks the Unix installer's
      # layout with a fake archive; the Windows installer has its own BROWSER_SOURCE path.
      - name: the browser pack installer lays out current
        run: ./scripts/test-browser-pack-install.sh
      # THE CONSOLE DEPLOY'S FIRST STEP IS THE HOST DEVICE'S DOOR. The fetch and the swap are
      # `runs.exec` calls on DESKTOP-9VH92BJ, so an offline device stops a console deploy even
      # though the console serves its page. The script must refuse by name before it builds, not
      # after a full build ends in a bare `HTTP Error 503`. The loopback stub touches no real
      # console or device.
      - name: the console deploy refuses a closed host door
        run: ./scripts/test-console-deploy-preflight.sh

      # The console page's pure decisions are a Rust crate outside the device workspace (its
      # artifact is wasm). Its parity tests are Rust, so they run here rather than in a JS job.
      - name: the console logic's Rust tests
        run: |
          cargo fmt --manifest-path device/console-logic/Cargo.toml -- --check
          cargo test --manifest-path device/console-logic/Cargo.toml
      - name: the device workspace formats
        run: cargo fmt --manifest-path device/Cargo.toml --all -- --check
      - name: the device workspace is clippy-clean
        run: cargo clippy --manifest-path device/Cargo.toml -p summrise-core -p summrise-device -p summrise-launch -p summrise-mesh -p summrise-release -p summrise-console -p summrise-winsec -p summrise-winsys -p summrise-shell --all-targets -- -D warnings

      # **A FORWARD IS A RULE, AND THE ONLY HONEST PROOF OF A FORWARDED CHANNEL IS A REAL sshd.**
      # `capabilities::forward`'s unit tests drive an IN-PROCESS SSH server, and that fixture cannot
      # be the authority for a forwarded channel's byte order (measured: with the fixture dialling
      # nothing and replying nothing, a client still read its own bytes back, which a real sshd does
      # not do). This step starts the runner's own sshd on a throwaway port with its own host key and
      # its own authorized_keys, and drives `device/tests/forward_wire.rs` against it — the rule
      # binds, `forward.list` reports it listening, an HTTP answer crosses the SSH connection byte for
      # byte, and `forward.remove` closes the listener.
      #
      # IT IS `--ignored`, NOT CONDITIONALLY SKIPPED (I8): the test needs an sshd it did not start,
      # and this step is what satisfies that. Deleting this step turns the test into a silent skip
      # instead of a red, which is why the step exists rather than a `#[ignore]` nothing runs.
      - name: a forward rule carries a real answer through a real sshd
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/forward"
          rm -rf "$work"
          mkdir -p "$work/keys"
          ssh-keygen -q -t ed25519 -N '' -f "$work/hostkey"
          ssh-keygen -q -t ed25519 -N '' -f "$work/client"
          cp "$work/client.pub" "$work/keys/authorized_keys"
          chmod 700 "$work/keys"
          chmod 600 "$work/keys/authorized_keys"
          port=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          cat > "$work/sshd_config" <<CONF
          Port $port
          ListenAddress 127.0.0.1
          HostKey $work/hostkey
          PidFile $work/sshd.pid
          AuthorizedKeysFile $work/keys/authorized_keys
          PubkeyAuthentication yes
          PasswordAuthentication no
          AllowTcpForwarding yes
          StrictModes no
          UsePAM no
          CONF
          /usr/sbin/sshd -f "$work/sshd_config" -E "$work/sshd.log"
          trap 'kill "$(cat "$work/sshd.pid" 2>/dev/null)" 2>/dev/null || true' EXIT
          SUMMRISE_FORWARD_VIA="$(whoami)@127.0.0.1:$port" \
            SUMMRISE_FORWARD_KEY="$work/client" \
            cargo test --manifest-path device/Cargo.toml -p summrise-device --test forward_wire \
              -- --ignored --nocapture

      # The panel is the device's own page, and it is the only surface a person sees without the
      # console; it gets the same measurement.
      - name: the device panel fits the window
        run: |
          export SUMMRISE_PANEL_DIR="$RUNNER_TEMP/panel-pages"
          rm -rf "$SUMMRISE_PANEL_DIR"
          mkdir -p "$SUMMRISE_PANEL_DIR"
          cargo test --quiet --manifest-path device/Cargo.toml -p summrise-device --bin summrise-device -- --ignored render_panel_for_review
          node scripts/layout-gate.mjs "$SUMMRISE_PANEL_DIR" 390 1280

  device-macos:
    name: device (macOS smoke, provisional)
    runs-on: macos-latest
    timeout-minutes: 45
    # **PROVISIONAL UNTIL THERE IS A GREEN RUN.** The code paths are `cfg(unix)` and the unit and
    # smoke are shared with Linux, but this project has not executed on macOS yet. The job is here to
    # produce the first evidence, not to claim it; it does not block a merge while that is true.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - name: build the device for macOS
        run: cargo build --manifest-path device/Cargo.toml -p summrise-device
      - name: the core serves on macOS
        run: ./scripts/device-unix-smoke.sh

  console-web:
    name: console web (the React page)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: device/console/web/package-lock.json
      - name: install the page's build dependencies
        working-directory: device/console/web
        run: npm ci
      # The gate is a browser proof, not a jsdom one; the browser is installed explicitly so the
      # cache does not have to carry it and the version is the one package-lock pins.
      - name: install the browser the gate drives
        working-directory: device/console/web
        run: npx playwright install --with-deps chromium
      # THE LOGIC IS RUST, AND ITS ARTIFACT IS COMMITTED. This check needs only Node: it recomputes
      # the source stamp and decodes the inlined base64 back to the committed wasm, so a source edit
      # with no rebuild fails here. `build-web.sh --check` runs it again; this step names the failure.
      - name: the wasm logic matches its sources
        run: node scripts/check-console-logic.mjs
      - name: the page typechecks
        working-directory: device/console/web
        run: npm run typecheck
      # **THE JSDOM SUITE IS A REQUIRED GATE.** Its tests assert the markup, labels and component
      # decisions that typecheck cannot see (an empty state's sentence, a rename that must not
      # freeze a generated label). Run it before the build check so a red suite fails on its own
      # name, not as a stale page.
      - name: the page's suite
        working-directory: device/console/web
        run: npm test
      # The page is embedded in the console binary with include_str!, so a source change that does
      # not update dist/index.html still compiles and still ships yesterday's UI. This is the gate.
      - name: the committed page is this source
        run: ./scripts/build-web.sh --check
      # SIGN IN → DEVICE → PTY → MARKER → CONNECT → TOKENS. The `/mcp` answer is an echo, not a
      # shell; the gate fails on any console error, which is how the missing saved-connections stub
      # was found.
      - name: sign in, open a pty, read the marker back, and count the token rows
        working-directory: device/console/web
        run: npm run gate:browser

  device-windows:
    name: device (the Windows lifecycle)
    runs-on: windows-latest
    # The sum of the step ceilings below is larger than 30 minutes, and a job ceiling shorter than a
    # step's is a per-step timeout that cannot fire (M6). The 90 is a ceiling, not a target.
    timeout-minutes: 90
    # **TWO DIFFERENT FIXTURE KEYS, ON PURPOSE (C1).** These are RFC 8032 §7.1's published test
    # vectors (seeds 1 and 2), never release keys. The launcher key owns the first generation: the
    # `--seed-sidecar` and the baseline pair. The release key owns updates: release documents and the
    # staged sidecar the app writes from one. Setting both to the same value — which this job did —
    # makes the distinction unrepresentable in the only test that can falsify it. Both binaries read
    # these at COMPILE time; the lane signs each artifact with the matching seed and fails by name on
    # a build that embedded the wrong one.
    env:
      SUMMRISE_LAUNCHER_PUBKEY: d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
      SUMMRISE_RELEASE_PUBKEY: 3d4017c3e843895a92b70aa74d1b7ebc9c982ccf2ec4968cc0cd55f12af4660c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      # **NO TARGET CACHE, DELIBERATELY.** The last step below rebuilds the two binaries UNKEYED, so
      # caching `device/target` would hand that unkeyed artifact to this job's keyed build next run
      # and make the key seam depend on cargo's environment tracking. A cold build is the cheaper
      # side of that trade.
      - name: build the binaries the lifecycle test drives
        run: cargo build --manifest-path device/Cargo.toml --workspace
      # **THE PORTABLE HALF RUNS ONCE.** The Linux `device` job already runs core, console, mesh and
      # release; repeating them here was a second copy of the same tests on a slower runner. Windows
      # runs the crates whose behaviour is OS-specific (ConPTY/serial, ACLs, sessions/tray) and the
      # lifecycle below, which is the only proof of the service, installer and update swap.
      - name: the Windows-specific crates
        timeout-minutes: 20
        run: cargo test --manifest-path device/Cargo.toml -p summrise-device -p summrise-winsec -p summrise-winsys -p summrise-shell
      # **THE LAUNCHER'S UNIT TESTS RUN UNKEYED, AT THE END.** They sign their fixtures with a
      # fixed seed and verify against the key this build embedded; in a keyed build the fixture
      # signature cannot match that key, so they belong to the placeholder build beside the
      # fail-closed test. (They were run here and were red on Windows for exactly that reason.)
      # THE LIFECYCLE, IN ONE PROCESS. It hung here on 2026-10-21 after its first test printed
      # `ok`; the cause was `Command::output()` waiting for a pipe that a restored app inherited,
      # fixed on 2026-10-22 (`72e24bfe`). The shared-process run is green again (verified by the
      # step below on the same commit), so the five per-test steps that diagnosed it are gone.
      - name: the Windows lifecycle
        timeout-minutes: 20
        run: cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --nocapture
      - name: the SCM service mode serves and stops
        run: cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --ignored --exact the_service_mode_serves_and_stops_through_the_scm --nocapture
      # THE PRODUCT INSTALLER, WHICH NO UNIT TEST CAN PROVE (I8/NEW-1): a tree with no baseline is
      # seeded from the app plus `--seed-sidecar`, `current\` appears, and the service serves it. It
      # owns the real SummriseLaunch service, so it is `#[ignore]`d and run here by exact name.
      - name: the product installer seeds a missing baseline
        run: cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --ignored --exact the_installer_seeds_a_missing_baseline_from_the_shipped_sidecar --nocapture
      # **THE NEGATIVE HALF OF C1**: a `--seed-sidecar` signed with the RELEASE key must be refused
      # with a message naming the launcher key, before anything is registered. With the two keys
      # above this is a real distinction, not a self-comparison.
      - name: a release-key-signed seed is refused by name
        run: cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --ignored --exact the_installer_refuses_a_seed_signed_with_the_release_key --nocapture
      # The only test of the product `--install-service`/`--uninstall-service` and the token mint; it
      # also reads the restart policy back with `sc qfailure` (I4). Same reason for `#[ignore]`.
      - name: the product installer mints the token once and configures restarts
        run: cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --ignored --exact the_install_service_mints_the_install_token_once --nocapture
      # **THE FAIL-CLOSED HALF OF THE KEY SEAM.** The variables above are job-wide on purpose, so
      # this step removes them, rebuilds, and runs only the placeholder test, which asserts BOTH
      # binaries refuse every update by name. The test is `#[ignore]`d, so the keyed workspace run
      # above cannot count a skipped placeholder test as a pass; `--ignored` is what runs it here.
      # `shell: bash` because the block is a shell script and the repository's own `workflow_shell`
      # gate parses the `run:` blocks it can see with `bash -n` (Git Bash ships on windows-latest).
      # `cargo clean -p` is not tidiness: the key is a compile-time constant, and the clean makes
      # "this build has no key" a fact of this build.
      - name: an unkeyed build refuses every update, by name
        shell: bash
        run: |
          unset SUMMRISE_LAUNCHER_PUBKEY SUMMRISE_RELEASE_PUBKEY
          cargo clean --manifest-path device/Cargo.toml -p summrise-launch -p summrise-device
          cargo build --manifest-path device/Cargo.toml --workspace
          cargo test --manifest-path device/Cargo.toml -p summrise-launch --lib
          cargo test --manifest-path device/Cargo.toml -p summrise-launch --test windows_lifecycle -- --ignored --exact a_build_without_a_release_key_refuses_updates_by_name --nocapture

  landing:
    name: landing (one page, two languages, measured contrast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # NO `setup-node`: the page's gate uses only `node:` builtins, and the runner's own Node is
      # enough. The command below is the same one a person runs locally — a local check that is not
      # CI's check is not the same check.
      - name: the page, its two languages, its contrast and its social card
        run: node landing/check.mjs
      # The same measurement the console's pages get: at a phone's width the front door must not
      # scroll sideways, and it must keep one h1.
      - name: the page fits a phone
        run: node scripts/layout-gate.mjs landing/public 390 768 1280
