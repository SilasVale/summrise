[workspace]
# `summrise-exec-argv` is a member so `cargo fmt --all` and the workspace's lockfile see it, but it is
# deliberately NOT a default member: it is a POSIX execve shim staged onto a *target* machine, and the
# Windows agent build must not try to produce it. It is built for the target triple on its own.
# `summrise-launch` is a member for the same reason `summrise-exec-argv` is: it is a small artifact
# STAGED ONTO A TARGET MACHINE (it replaces the two `.vbs` wrappers `wscript.exe` used to run), and the
# Windows agent build must not fold it into `summrise-agent.exe`. It is built for the target triple on
# its own, and it is NOT a default member.
# `sweep-judge` is a member so `cargo fmt --all` and the workspace's lockfile see it, and it is NOT a
# default member for the same reason as the two above: it is not part of `summrise-agent.exe`. It is the
# Rust home of the design sweeps' judge, which used to be `agent/scripts/<tool>.mjs --judge`, and the
# gate scripts build and run it on their own.
# `sweep-plan` is a member so `cargo fmt --all` and the workspace's lockfile see it, and it is NOT a
# default member for the same reason as the four above: it is not part of `summrise-agent.exe`. It is the
# Rust home of the design sweeps' PLAN — which surfaces are visited and which passes run on each — which
# used to be computed inside the payloads the emitters inject. The emitters run it at EMIT time and embed
# its output, so the plan a browser-side payload consumes is Rust data.
# `summrise-cli` is a member so `cargo fmt --all` and the workspace's lockfile see it, and it is NOT a
# default member for the same reason as the three above: it is not part of `summrise-agent.exe`. It is the
# Rust home of the `summrise` CLI's decisions, ported from `summrise-agent-npm/src/summrise.ts` with that
# package's own `node --test` suite as the oracle. The npm `bin` is deliberately NOT repointed yet: the
# port is proven first, and the cutover is a later landing.
# `summrise-url-policy` is a member so `cargo fmt --all`, `cargo clippy` and the workspace's lockfile see
# it, and it is NOT a default member for the same reason as the four above: it is not part of
# `summrise-agent.exe` — it is built to wasm (`wasm-pack --target nodejs`) and REQUIRED by the Electron
# shell's main process, which a different package ships (landing 6). It is a member rather than its own
# workspace (`agent/resources/panel-logic` is the other arrangement for a wasm crate here) because its
# decisions are Rust the agent's toolchain lints and tests, and `cargo test -p summrise-url-policy` is
# part of the landing's bar.
# `model-drift` is a member so `cargo fmt --all`, `cargo clippy` and the workspace's lockfile see it, and
# it is NOT a default member for the same reason as the five above: it is not part of
# `summrise-agent.exe`. It is the Rust home of `scripts/model-drift.mjs` — the ops tool that compares
# what the gateway's catalogue advertises against what each channel's upstream actually lists — which is
# deleted in the same landing, so `cargo test -p summrise-model-drift` is the whole bar.
members = [".", "summrise-command-core", "summrise-exec-argv", "summrise-launch", "sweep-judge", "sweep-plan", "summrise-cli", "summrise-url-policy", "model-drift"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "1.0.145"

[package]
name = "summrise-agent"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "summrise-agent"
path = "src/main.rs"

[dependencies]
summrise-agent-core = { path = "summrise-command-core" }
rmcp = { version = "2", features = ["server", "transport-streamable-http-server", "macros", "client", "transport-streamable-http-client-reqwest", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process", "signal"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
axum = "0.8"
bytes = "1"
http-body-util = "0.1"
tower = "0.5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
futures = "0.3"
process-wrap = { version = "9", features = ["tokio1"] }
wait-timeout = "0.2"

# Optional deps — gated behind features; headless builds skip them entirely.
russh = { version = "0.55", default-features = false, features = ["ring"], optional = true }
russh-sftp = { version = "2.3", optional = true }
portable-pty = { version = "0.8", optional = true }
keyring = { version = "2", optional = true }

# The argv frame, shared with the helper that is staged onto a workspace host. It is a dependency
# rather than a copy so the writer here and the reader there cannot drift: a writer free to emit a
# count or a length the reader refuses would only fail on a machine nobody is watching. The crate
# has no dependencies of its own, and this one is gated with the SSH client that drives it.
summrise-exec-argv = { path = "summrise-exec-argv", optional = true }

serde_yaml = "0.9"

# HTTP client for the update plugin (agent_update MCP tool). rustls-tls keeps the
# cross-compile pure-Rust — native-tls pulls Windows schannel and breaks xwin.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }

# Installer integrity check (agent_update): the release server publishes the
# SHA-256 of SummriseAgent-Setup.exe; the agent verifies the download before
# spawning it (an AI-triggerable RCE path must not trust the transport alone).
sha2 = "0.10"

# Binary writes to terminal sessions (terminal_write data_base64) — a JSON
# string argument goes through UTF-8 validation, so non-UTF-8 serial frames
# (control bytes, binary protocols) need an explicit base64 path (round-54).
base64 = "0.22"

# round-137 Plan C: the hand-rolled WebSocket upgrade for /api/browser/ws
# needs to compute Sec-WebSocket-Accept (SHA-1); hyper is explicitly
# introduced to use upgrade::on and get the raw IO after the upgrade (axum
# 0.8 already depends on hyper 1, zero new compilation).
sha1 = "0.10"
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }

# Windows-only: lets the headless binary register itself as the `SummriseCommand`
# Windows service (SCM protocol). Ignored entirely on Linux/macOS builds.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[dev-dependencies]
rmcp = { version = "2", features = ["client", "transport-streamable-http-client-reqwest"] }
# `exec_capture`'s transport is verified against an in-process SSH server, and a server needs a host
# key. Generated per test run rather than committed: a private key in the tree is a private key in
# every clone, and a scanner cannot tell a test key from a real one. Test-only, so it costs the
# shipped binary nothing.
rand = "0.8"


[features]
default = []
# Real terminal backends (PTY/SSH/Serial).
terminal = ["dep:portable-pty", "dep:russh", "dep:russh-sftp", "dep:summrise-exec-argv"]
# OS keychain secrets for SSH passwords.
keyring = ["dep:keyring"]

# ProcessPrng workaround: use CPU RDRAND instruction instead of Windows API
# This avoids the ProcessPrng/BCryptGenRandom dependency.
# All crates (ring, uuid) share this single getrandom instance.
[dependencies.getrandom]
version = "0.2"
features = ["rdrand"]

# stage-m: portable-pty is vendored + patched — its stock ConPTY flags set
# PSEUDOCONSOLE_WIN32_INPUT_MODE (0x4), which echoes console output back as
# input events; PSReadLine then renders `>>` after every OSC 633 (VS Code
# shell integration). The patch drops that flag (node-pty/VSCode parity).
[patch.crates-io]
portable-pty = { path = "vendor-portable-pty" }
