[package]
name = "summrise-launch"
version.workspace = true
edition = "2021"
description = "Start a process with NO console window, and do not wait — the Rust replacement for the two .vbs wrappers wscript.exe used to run"
license = "Apache-2.0"
publish = false

# No dependencies, deliberately, for the reason `summrise-exec-argv` gives in the same words: this
# binary is staged onto a machine that may have no toolchain, no package manager and no network, so
# it must be a single artifact whose behaviour is readable in one sitting. It also runs every five
# minutes under a scheduled task, so a dependency tree would be a start-up cost paid forever.
[dependencies]

[[bin]]
name = "summrise-launch"
path = "src/main.rs"

[lib]
name = "summrise_launch"
path = "src/lib.rs"

[features]
# The `#[cfg_attr(feature = "cargo-clippy", …)]` arms in this crate need the feature DECLARED. Without
# it, `unexpected_cfgs` fires — and under CI's `-D warnings` that is an ERROR, not a warning.
# MEASURED on `ddaf0517`: the clippy step went red on `summrise-launch` with
# `unexpected cfg condition value: cargo-clippy`, on a tree that had passed the same step minutes
# earlier, because `dtolnay/rust-toolchain@master` is a FLOATING toolchain and the lint arrived with it.
cargo-clippy = []
