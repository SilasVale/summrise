<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Summrise Agent</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- React mounts here (panel-react/src/main.tsx renders <App /> into #root).
       The vanilla DOM (conn form, panel shell) was migrated to React components
       in round-75..79; panel.css styles are reused via the same IDs/classes. -->
  <div id="root"></div>
  <!-- P2-6: the vendor xterm UMD globals (window.Terminal/FitAddon) are dead —
       TerminalPane imports @xterm/xterm + addons from the npm bundle in
       panel.js. The two vendor <script> tags are removed (two blocking
       downloads + ~stale duplicate xterm copy saved). vendor/xterm.css STAYS:
       the bundle never imports @xterm/xterm's CSS, so the base terminal
       styles still come from that link. -->
  <script type="module" src="panel.js"></script>
</body>
</html>
