[package]
name = "summrise-zen-go"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Rust half of the zen-go satellite worker (workers-rs). FIRST HALF: the Anthropic<->OpenAI translation and the SSE encoder."

[lib]
# Both crate types, the same reason as the other two worker crates: `cdylib` is what `worker-build`
# produces for Cloudflare and `rlib` is what `cargo test` links on the host.
crate-type = ["cdylib", "rlib"]
name = "summrise_zen_go"
path = "src/lib.rs"

[dependencies]
# A PATH DEPENDENCY ON THE SIBLING WORKER'S CRATE, and it is the one thing here that is a design
# decision rather than a port: `zen-go`'s policy functions are BYTE-IDENTICAL to `zen-us`'s in the
# JavaScript, and a rule that exists twice in one language is how the two satellites drift — which
# they already have, in the `[::1]` case `summrise-zen-us`'s header documents. ADR 0003 keeps the
# satellite workers AUTONOMOUS (no shared npm package); a shared RUST crate is not a shared
# deployment and does not couple their releases.
# `default-features = false` BECAUSE BOTH CRATES EXPORT A `fetch` ENTRYPOINT. With the sibling's `worker`
# feature on, building this crate for wasm32 compiled BOTH `#[event(fetch)]` exports into one module and
# wasm-bindgen refused it — measured: `error: the name \`fetch\` is exported by multiple crates in this
# build`. The host build never sees it, because both modules are behind `#[cfg(target_arch = "wasm32")]`.
# **THIS IS THE COST OF THE SHARED CRATE, AND IT IS PAID HERE RATHER THAN BY COPYING THE POLICY AGAIN.**
summrise-zen-us = { path = "../../zen-us-proxy/worker", default-features = false }
# THE WORKER RUNTIME, TAKEN NOW BECAUSE THE ENTRY POINT IS HERE. `worker.rs` is behind
# `#[cfg(target_arch = "wasm32")]` because `#[event(fetch)]` expands to nothing on the host and panics
# there, so every decision above still builds and tests with no wasm toolchain at all. Same 0.8.7 as the
# other three workers.
worker = "0.8.7"
# AND `web-sys` DIRECTLY: `worker::RequestInit` has no signal field, so the header budget's
# `AbortController` can only be attached by building the `web_sys::RequestInit` here. Same 0.3.106 that
# `worker` pins, with the four features `worker.rs` names.
web-sys = { version = "0.3.106", features = ["Request", "RequestInit", "Headers", "AbortSignal"] }
# THE RACE: `fetch` resolves when the HEADERS arrive, so the port has to stop WAITING at the budget
# without stopping the BODY. Same reason and same crate as `zen-us` and `gateway/wasm`.
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
# **`preserve_order` IS NOT OPTIONAL HERE.** serde_json's default Map is a BTreeMap, which SORTS KEYS
# ALPHABETICALLY — so the ported objects would come back in a different order than the JavaScript's
# object literals, and the response is compared BYTES. The feature makes Map an insertion-ordered
# map, which is what "the same document" means for a transliteration.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# THE JUDGE HALF OF THIS CRATE'S DIFFERENTIAL — the same dev-dependency as the sibling crate's, and for the
# same reason: the harness spawns `node` and reads files, so it must never be linked into the worker this
# crate builds for wasm32. One copy of the judge, two satellites.
summrise-differential-harness = { path = "../../differential-harness" }
