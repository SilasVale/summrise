[package]
name = "summrise-zen-us"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Rust half of the zen-us satellite worker (workers-rs). FIRST HALF: the origin policy and the secret redaction."

# BOTH crate types, for the same reason the CDN worker's crate lists both: `cdylib` is what
# `worker-build` produces for Cloudflare and `rlib` is what `cargo test` links on the host — so the
# pure half is testable with no wasm toolchain at all.
[lib]
crate-type = ["cdylib", "rlib"]
name = "summrise_zen_us"
path = "src/lib.rs"

[dependencies]
# A host and a fallback: the port is about the POLICY, not about the deployment, and no `worker`
# dependency is taken until the entry point is ported — which keeps `cargo test` a plain host build.
url = "2"
# THE WORKER RUNTIME, TAKEN NOW BECAUSE THE ENTRY POINT IS HERE — and the paragraph this replaces said
# it would be taken "until the entry point is ported, which keeps `cargo test` a plain host build".
# **THAT IS STILL TRUE**: `worker.rs` is behind `#[cfg(target_arch = "wasm32")]` because `#[event(fetch)]`
# expands to nothing on the host and panics there, so every decision in `lib.rs` still builds and tests
# with no wasm toolchain. Pinned to the same 0.8.7 as `gateway/wasm` and `index/worker`.
worker = "0.8.7"
# **AND `web-sys` DIRECTLY, WHICH IS THE WHOLE FINDING OF THE PREVIOUS ROUND.** `worker::RequestInit`
# has NO signal field and its conversion into `web_sys::RequestInit` sets five things and no signal — read
# at `worker-0.8.7/src/request_init.rs:12` and `:66`. The header budget is a `finally` in the shipping
# JavaScript (`clearTimeout` once the headers arrive) and the SIGNAL is what makes it that rather than a
# whole-fetch budget, so the init has to be built here. Same 0.3.106 `worker` pins, with the four features
# this file names.
web-sys = { version = "0.3.106", features = ["Request", "RequestInit", "Headers", "AbortSignal"] }
# THE RACE, AND WHY IT IS A DEPENDENCY: `fetch` resolves when the HEADERS arrive, so the port has to stop
# WAITING at the budget without stopping the BODY — and `select` is what makes the two outcomes explicit
# rather than a shared flag two tasks poll. `gateway/wasm` already takes it for the same kind of reason, and
# its `Cargo.toml` carries the measured size delta (+108,315 raw / +29,013 gz).
futures-util = { version = "0.3", default-features = false }
serde_json = "1"
# SHA-256 FOR `safe_eq`, and the reason it is a dependency and not 64 hand-rolled lines is in the
# function's own doc comment: this crate already took `url` and `serde_json` for the same reason, and
# the repo has a receipt for the other kind of decision (the `regex` line in the CDN worker, with its
# number in the commit that added it).
sha2 = "0.10"

# NO [profile.release] OVERRIDES ON PURPOSE, the same reason as the CDN worker: the deployed module
# is what `worker-build --release` produces with the default profile, so the size is the number a
# naive migration gets, not a tuned best case.

[features]
# **THE WASM HALF IS A FEATURE, AND IT IS ON BY DEFAULT — WHICH IS THE PART THAT MATTERS.**
# `zen-go` DEPENDS ON THIS CRATE for the policy functions they share (`Cargo.toml` there documents the
# decision), and both crates export a `#[event(fetch)]` entrypoint. Building `zen-go` for wasm32 therefore
# compiled BOTH entrypoints into one module and wasm-bindgen refused it, measured:
#
#     error: the name `fetch` is exported by multiple crates in this build
#
# The host build never sees it, because `worker.rs` is behind `#[cfg(target_arch = "wasm32")]`. So the
# entrypoint is gated on a feature that is ON here (this crate's own worker build needs it) and OFF for a
# dependent that has its own — `zen-go` takes this crate with `default-features = false`.
default = ["worker"]
worker = []

[dev-dependencies]
# THE JUDGE HALF OF THIS CRATE'S DIFFERENTIAL, AND IT IS A DEV-DEPENDENCY ON PURPOSE: the harness spawns
# `node` and reads files, so it must never be linked into the worker this crate builds for wasm32. The
# cases, the upstream answers and the byte comparison live there (one copy, shared with `zen-go`), and
# `gateway/wasm/run-cases.mjs` is the only part that stays JavaScript — it executes the built module.
summrise-differential-harness = { path = "../../differential-harness" }
