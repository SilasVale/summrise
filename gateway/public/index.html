    <!-- THE CONSOLE'S RUST IS FETCHED AND COMPILED WHILE THE BUNDLE IS STILL DOWNLOADING.
         `wasm/consoleLogic.ts` awaits this before React mounts, which is what makes a migrated
         function callable DURING RENDER; it is inline rather than a `<link rel=preload>` because the
         COMPILE is main-thread work and a preload leaves it to the first render (+11 ms measured on
         the panel, whose seam header carries the alternating A/B).

         AND IT IS A CLASSIC SCRIPT, NOT `type="module"`, WHICH IS NOT A STYLE CHOICE: Vite EXTRACTS
         an inline module script into the bundle, so the fetch would start when the bundle EXECUTES —
         the +11 ms timing this exists to avoid. A classic inline script is left where it is and runs
         at PARSE time, which is earlier than the deferred bundle. `fetch` and
         `WebAssembly.compileStreaming` are both available to it.

         The URL is absolute because the console's routes are client-side, and `public/_headers`
         makes it revalidate so a deploy cannot pair a new bundle with a cached module. -->
    <script>
      window.__consoleLogicModule = fetch("/ui_logic_bg.wasm").then(function (r) {
        if (!r.ok) throw new Error("ui_logic_bg.wasm: " + r.status);
        return WebAssembly.compileStreaming(r);
      });
    </script>
