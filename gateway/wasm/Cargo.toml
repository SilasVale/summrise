[package]
name = "summrise-gate-wasm"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Rust half of the Summrise Gate worker (workers-rs). FIRST ROUTE: GET /api/health."

# A Cloudflare Worker, built by `worker-build --release` — NOT by wasm-pack, which
# was never used for a Worker on this repository and whose binaryen hang (14 min,
# measured) does not apply to this path (worker-build: 5.5 s, P3.0).
[lib]
# BOTH crate types: `cdylib` is what `worker-build` produces for Cloudflare and `rlib` is what
# `cargo test` and the differentials link on the host — so the translation is testable with no wasm
# toolchain at all.
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = "0.8.7"
serde = { version = "1", features = ["derive"] }
# ALREADY IN THE TREE (worker depends on it), so parsing an Origin costs no extra bytes.
url = "2"
# `worker` already links serde_json (its own dependency), so this line adds no
# second copy of it to the module — the size measurement in the commit message is
# the check on that claim, not this comment.
serde_json = { version = "1", features = ["preserve_order"] }
# ALREADY IN THE TREE (worker depends on it) — AND THE SIZE MEASUREMENT FALSIFIED THE CLAIM I FIRST WROTE
# HERE, which was "so `unfold` costs no extra bytes". Measured on the wasm32 release artifact:
#
#     before this line and the streaming glue:  1,620,415 raw / 436,318 gz
#     after:                                    1,728,730 raw / 465,331 gz
#     delta:                                     +108,315 raw /  +29,013 gz
#
# Being in the lockfile is not the same as being linked: `default-features = false` keeps the executor and the
# channels out, but the stream machinery and the glue are real bytes. The comment is the number now, because a
# claim about size that nothing measures is the kind of sentence this repository keeps finding.
futures-util = { version = "0.3", default-features = false }
# `preserve_order` IS NOT OPTIONAL FOR THE TRANSLATION: serde_json's default `Map` is a BTreeMap,
# which SORTS KEYS ALPHABETICALLY, and the translated document is compared BYTES — the key order is
# the wire order.

# NO [profile.release] OVERRIDES ON PURPOSE — same reason as P3.0's spike: the
# deployed module is what `worker-build --release` produces with the default
# profile, so the size below is the number a naive migration gets, not a tuned
# best case. (The plan's P2 finding is that a naive port pays costs it cannot see;
# the honest move is to MEASURE the naive one first.)
